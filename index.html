<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Host - Cerdas Cermat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg-main: #e2e8f0; 
    --bg-panel: rgba(255, 255, 255, 0.7); 
    --bg-card: #ffffff;
    --text-main: #1e293b; --text-muted: #64748b; --border-color: #cbd5e1;
    --tim1: #ef4444; --tim2: #3b82f6; --tim3: #22c55e; --tim4: #a855f7;
    --tim5: #f97316; --tim6: #14b8a6; --tim7: #ec4899; --tim8: #84cc16;
    --blue-theme: #0ea5e9;
  }

  body {
    height: 100vh; width: 100vw; overflow: hidden; 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 50%, #fae8ff 100%);
    color: var(--text-main);
  }

  /* LAYAR SETUP ROOM */
  #setupScreen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; width: 100vw; padding: 20px; background: rgba(255,255,255,0.8);
    position: fixed; top: 0; left: 0; z-index: 1000;
  }
  .login-box {
    background: #ffffff; padding: 30px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5);
    width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px;
  }
  .login-box h1 { text-align: center; color: var(--blue-theme); margin-bottom: 5px; font-size: 28px;}
  .login-box input {
    padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);
    font-size: 20px; font-weight: bold; background: #f8fafc; color: var(--text-main); outline: none; text-align: center; letter-spacing: 2px;
  }
  .login-box button {
    padding: 14px; border-radius: 10px; border: none; background: var(--blue-theme); color: white;
    font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .btn-logout-setup { background: #ef4444 !important; margin-top: 10px; font-size: 14px !important;}
  .team-info-badge { text-align: center; font-size: 14px; font-weight: bold; color: #0284c7; background: #e0f2fe; padding: 10px; border-radius: 6px; }

  /* PANEL HOST UTAMA */
  #appContainer { display: none; flex-direction: column; height: 100%; padding: 12px; gap: 12px; }
  
  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-panel); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 16px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.02); z-index: 10;
  }
  .header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 800; color: #334155;}
  .header h1 span { color: var(--blue-theme); }
  
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn-header { 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; font-weight: 600; 
    color: #64748b; font-size: 11px; gap: 4px; padding: 6px 10px; border-radius: 8px; transition: 0.2s;
  }
  .btn-header:hover { background: rgba(255,255,255,0.5); color: var(--blue-theme); }
  .btn-header i { font-size: 18px; font-style: normal; }
  .btn-header.logout { color: #ef4444; }
  .btn-header.logout:hover { background: #fee2e2; }

  .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 0; }
  .column { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  
  .panel {
    background: var(--bg-panel); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; position: relative;
    border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  }
  .panel-title { font-size: 13px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;}

  /* TIMER PANEL */
  .timer-panel { flex: 0 0 auto; }
  
  .btn-maximize {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.5); color: #475569; border: 1px solid rgba(255,255,255,0.8);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; 
    font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .btn-maximize:hover { background: #ffffff; color: var(--blue-theme); }

  /* Desain Input Waktu Inline */
  .time-input-group { 
    display: flex; gap: 5px; align-items: center; justify-content: center; 
    margin: 5px 0; 
  }
  .time-input-box { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  
  .time-input-box input {
    width: 80px; height: 60px; text-align: center; font-size: 40px; font-weight: 900;
    border-radius: 10px; border: 2px solid transparent; background: transparent; color: var(--text-main);
    padding: 0; transition: 0.2s; outline: none;
  }
  .time-input-box input:hover:not(:disabled) { border-color: #cbd5e1; background: #ffffff; cursor: text;}
  .time-input-box input:focus:not(:disabled) { background: #ffffff; border-color: var(--blue-theme); box-shadow: 0 0 10px rgba(14,165,233,0.2);}
  
  .time-input-box input:disabled { color: var(--blue-theme); cursor: default; opacity: 1;}
  .time-input-box input.urgent { color: #ef4444; }
  
  .time-input-box span { font-size: 10px; font-weight: 800; color: #94a3b8; letter-spacing: 1px;}
  .time-colon { font-size: 40px; font-weight: 900; color: var(--text-main); margin-top: -15px;}

  /* Tombol Ikon Play, Pause, Stop */
  .timer-controls { display: flex; gap: 12px; justify-content: center; margin-top: 5px;}
  .btn-icon {
    width: 60px; height: 45px; border-radius: 12px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .btn-icon:active { transform: scale(0.95); }
  
  .btn-icon.play { background: #34d399; color: white; }
  .btn-icon.pause { background: #fbbf24; color: white; }
  .btn-icon.stop { background: #f87171; color: white; }
  .icon-svg { width: 20px; height: 20px; fill: currentColor; }

  /* BUZZER */
  .buzzer-panel { flex: 0 0 auto; }
  .buzzer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;}
  .buzzer-status { font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; text-transform: uppercase;}
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .buzzer-status.open { color: #059669; } .buzzer-status.open .dot { background: #10b981; box-shadow: 0 0 5px #10b981;}
  .buzzer-status.locked { color: #dc2626; } .buzzer-status.locked .dot { background: #ef4444; }

  .btn-group-top { display: flex; gap: 10px; width: 100%; }
  .btn-ctrl { 
    flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; 
    font-weight: 800; font-size: 15px; color: white; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .btn-ctrl:active { transform: scale(0.97); }
  .btn-ctrl.buka { background: #34d399; }
  .btn-ctrl.tutup { background: #fbbf24; }
  .btn-ctrl.reset { background: #f87171; }

  /* CHAT (KIRI BAWAH) */
  .chat-panel { flex: 1; min-height: 0; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
  .chat-msg { background: rgba(255,255,255,0.7); padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 90%; border: 1px solid rgba(255,255,255,0.9);}
  .chat-msg.host { background: rgba(224, 231, 255, 0.8); color: #1e3a8a; align-self: flex-end; text-align: right; border: 1px solid #c7d2fe;}
  .chat-who { font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 800;}
  .chat-input { display: flex; gap: 8px; margin-top: 8px; flex-shrink: 0;}
  .chat-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); color: var(--text-main); font-size: 14px; outline: none;}
  .chat-input button { border-radius: 8px; border: none; background: var(--blue-theme); color: white; padding: 0 20px; font-weight: bold; cursor: pointer;}

  /* QR CODE (KANAN ATAS) */
  .qr-panel { flex-shrink: 0; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; }
  .qr-card { background: #ffffff; padding: 12px; border-radius: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: none;}
  .qr-card h3 { margin: 0; font-size: 13px; color: #1e293b; font-weight: 800;}
  .qr-wrapper { background: #ffffff; padding: 4px; border-radius: 6px; display: inline-block;}
  .qr-wrapper canvas, .qr-wrapper img { width: 65px !important; height: 65px !important; display: block;}
  .btn-zoom { background: rgba(241, 245, 249, 0.8); color: #475569; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; width: 100%; font-weight: bold;}

  #qrModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 20px;}
  #qrModal .qr-wrapper { padding: 20px; border-radius: 12px; background: white;}
  #qrModal canvas, #qrModal img { width: 300px !important; height: 300px !important;}
  #qrModal h2 { color: white; margin: 0; font-size: 32px;}

  /* PLAYER (KANAN BAWAH - LEBIH BESAR) */
  .player-panel { flex: 1; overflow: hidden; }
  .player-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 6px; flex: 1; margin-top: 5px;}
  .player-row { background: rgba(255,255,255,0.6); padding: 10px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; border: 1px solid rgba(255,255,255,0.9); }
  .player-row.t1 { border-left: 5px solid var(--tim1); } .player-row.t2 { border-left: 5px solid var(--tim2); }
  .player-row.t3 { border-left: 5px solid var(--tim3); } .player-row.t4 { border-left: 5px solid var(--tim4); }
  .player-row.t5 { border-left: 5px solid var(--tim5); } .player-row.t6 { border-left: 5px solid var(--tim6); }
  .player-row.t7 { border-left: 5px solid var(--tim7); } .player-row.t8 { border-left: 5px solid var(--tim8); }
  
  .device-count { font-size: 12px; background: rgba(0,0,0,0.05); padding: 4px 8px; border-radius: 6px; color: #475569; font-weight: 800;}
  .btn-del-player { background: transparent; color: #ef4444; border: none; cursor: pointer; font-size: 16px; margin-left: 8px; font-weight: bold;}
  .btn-del-player:hover { color: #b91c1c; }

  /* POPUPS */
  #winnerPopup {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #ffffff; padding: 40px 60px; border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 4px solid #fbbf24;
    z-index: 1000; text-align: center; flex-direction: column; align-items: center; gap: 20px;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .winner-title { font-size: 28px; color: #64748b; font-weight: 800; letter-spacing: 2px; }
  .winner-name { font-size: 68px; font-weight: 900; margin: 10px 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
  .winner-team { font-size: 24px; font-weight: 800; color: #475569; }
  .btn-close-winner { background: #ef4444; color: white; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 20px; transition: 0.2s; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4); }
  .btn-close-winner:hover { background: #dc2626; transform: scale(1.05); }

  #timerOverlay {
    display: none; position: fixed; top: 20%; left: 20%;
    width: 350px; height: 250px; 
    background: rgba(255, 255, 255, 0.95); z-index: 500;
    flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2px solid #cbd5e1; border-radius: 16px; 
    overflow: hidden; resize: both;
  }
  #timerHeader {
    width: 100%; padding: 8px 12px; background: #f1f5f9; cursor: grab;
    display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; font-weight: bold; color: #475569; font-size: 13px; border-bottom: 1px solid #e2e8f0; user-select: none;
  }
  #timerHeader:active { cursor: grabbing; }
  
  .header-controls { display: flex; gap: 6px; }
  .btn-header-ctrl {
    background: #cbd5e1; color: #475569; border: none; 
    width: 26px; height: 26px; border-radius: 6px;
    font-size: 14px; font-weight: bold; cursor: pointer; 
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .btn-header-ctrl:hover { background: #94a3b8; color: white; }
  .btn-header-ctrl.close:hover { background: #ef4444; color: white; }

  .timer-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding-top: 20px; overflow: hidden; }
  #popupTimerValue { 
    font-size: clamp(3rem, 12vw, 8rem); width: 100%; text-align: center;
    font-weight: 900; color: var(--blue-theme); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: 2px;
  }
  #timerOverlay.urgent #popupTimerValue { color: #ef4444; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.8); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }
</style>
</head>
<body>

<!-- LAYAR SETUP ROOM -->
<div id="setupScreen">
  <div class="login-box">
    <h1>Buat Room</h1>
    <div class="team-info-badge" id="setupTeamInfo">...</div>
    <input type="text" id="newRoomId" placeholder="ID ROOM (MISAL: CCA2026)" value="CCA2026" style="text-transform: uppercase;">
    <button onclick="buatRoom()">Buat & Mulai Kuis</button>
    <button class="btn-logout-setup" onclick="logoutHost()">Logout</button>
  </div>
</div>

<!-- PANEL HOST UTAMA -->
<div id="appContainer">
  <div class="header">
    <h1><span style="font-size:24px; font-weight:900; color:#0ea5e9;">HP</span> Host Panel <span style="color:#cbd5e1; margin:0 10px;">|</span> <span style="font-size:16px; color:#64748b;">Room: <span style="color:#0ea5e9; font-weight:bold;" id="roomIdLabel">...</span></span></h1>
    <div class="header-actions">
      <button class="btn-header" onclick="paksaSinkron(event)">
        <i>🔄</i> Sinkron
      </button>
      <button class="btn-header" onclick="hapusChat()">
        <i>🗑️</i> Hapus Chat
      </button>
      <button class="btn-header" onclick="resetTotal()">
        <i>↺</i> Reset Total
      </button>
      <button class="btn-header logout" onclick="logoutHost()">
        <i>⏻</i> Logout
      </button>
    </div>
  </div>

  <div class="grid-container">
    <!-- KOLOM KIRI (Timer, Buzzer, Chat) -->
    <div class="column">
      
      <div class="panel timer-panel">
        <button class="btn-maximize" onclick="tampilkanTimer()" title="Tampilkan Pop-up">⛶</button>
        <p class="panel-title">⏱ Timer Kuis</p>
        
        <div class="time-input-group">
          <div class="time-input-box">
            <input type="text" id="timerHour" value="00" maxlength="2" oninput="validateInput(this, 99)">
            <span>JAM</span>
          </div>
          <div class="time-colon">:</div>
          <div class="time-input-box">
            <input type="text" id="timerMin" value="00" maxlength="2" oninput="validateInput(this, 59)">
            <span>MENIT</span>
          </div>
          <div class="time-colon">:</div>
          <div class="time-input-box">
            <input type="text" id="timerSec" value="30" maxlength="2" oninput="validateInput(this, 59)">
            <span>DETIK</span>
          </div>
        </div>
        
        <div class="timer-controls">
          <button class="btn-icon play" onclick="startTimer()" title="Play">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="btn-icon pause" onclick="pauseTimer()" title="Pause">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="btn-icon stop" onclick="stopTimer()" title="Stop / Reset">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          </button>
        </div>
      </div>

      <div class="panel buzzer-panel">
        <div class="buzzer-header">
          <p class="panel-title" style="margin:0;">⚠ Tombol Cepat (Buzzer)</p>
          <div class="buzzer-status locked" id="buzzerStatus">
            <span>STATUS: TERKUNCI</span> <div class="dot"></div>
          </div>
        </div>
        <div class="btn-group-top">
          <button class="btn-ctrl buka" onclick="bukaBuzzer()">▶ Buka</button>
          <button class="btn-ctrl tutup" onclick="tutupBuzzer()">🔒 Tutup</button>
          <button class="btn-ctrl reset" onclick="resetBuzzer()">↺ Reset</button>
        </div>
      </div>

      <!-- CHAT DIPINDAHKAN KE KIRI BAWAH -->
      <div class="panel chat-panel">
        <p class="panel-title">💬 Live Chat & Broadcast</p>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-input">
          <input id="hostChatInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')kirimChatHost()">
          <button onclick="kirimChatHost()">Kirim</button>
        </div>
      </div>
    </div>

    <!-- KOLOM KANAN (QR Code, Pemain) -->
    <div class="column">
      <div class="panel qr-panel">
        <p class="panel-title">📱 QR Code Registrasi Tim</p>
        <div class="qr-grid" id="qrGrid"></div>
      </div>

      <!-- PEMAIN DIPINDAHKAN KE KANAN BAWAH (LEBIH BESAR) -->
      <div class="panel player-panel">
        <p class="panel-title">👥 Pemain Terhubung</p>
        <div class="player-list" id="playerList"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL POP-UP TERCEPAT -->
<div id="winnerPopup">
  <div class="winner-title">🏅 TERCEPAT ADALAH</div>
  <div class="winner-team" id="popupTeam"></div>
  <div class="winner-name" id="popupName"></div>
  <button class="btn-close-winner" onclick="tutupWinnerPopup()">✕ Tutup & Reset</button>
</div>

<!-- WINDOW MELAYANG: TIMER OVERLAY -->
<div id="timerOverlay">
  <div id="timerHeader">
    <span>⏱ TIMER</span>
    <div class="header-controls">
      <button class="btn-header-ctrl" onclick="minimizeTimer()" title="Minimize">—</button>
      <button class="btn-header-ctrl close" onclick="stopTimer()" title="Close & Reset">✕</button>
    </div>
  </div>
  <div class="timer-content">
    <div id="popupTimerValue">00:30</div>
  </div>
</div>

<!-- MODAL QR -->
<div id="qrModal" onclick="tutupModalQR()">
  <h2 id="qrModalTitle">Tim 1</h2>
  <div class="qr-wrapper" id="qrModalTarget"></div>
  <p style="color:#cbd5e1; font-size:18px;">Klik di mana saja untuk menutup</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, remove, push, serverTimestamp, query, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB98iws-cuHwi5jOftorleJ1-lwxJby0l0",
    authDomain: "cerdascermat-a3206.firebaseapp.com",
    databaseURL: "https://cerdascermat-a3206-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cerdascermat-a3206",
    storageBucket: "cerdascermat-a3206.firebasestorage.app",
    messagingSenderId: "1098230358098",
    appId: "1:1098230358098:web:301f0f0d25b220de75ff8b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let roomId = '';
  let teamCount = 4; 
  let serverOffset = 0;
  let timerInterval = null;
  let lastTickSecond = -1;
  let playerListenerRef = null;
  let isTimerHidden = false;
  let currentWinnerKey = ""; 
  let isPopupVisible = false;
  
  let isPaused = false;
  let pausedTimeRemaining = 0;

  const dragItem = document.getElementById('timerOverlay');
  const dragHandle = document.getElementById('timerHeader');
  let active = false;
  let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

  dragHandle.addEventListener("mousedown", dragStart);
  document.addEventListener("mouseup", dragEnd);
  document.addEventListener("mousemove", drag);

  function dragStart(e) {
    if (e.target.classList.contains('btn-header-ctrl')) return; 
    initialX = e.clientX - xOffset;
    initialY = e.clientY - yOffset;
    if (e.target === dragHandle || e.target.parentElement === dragHandle) active = true;
  }
  function dragEnd() { active = false; }
  function drag(e) {
    if (active) {
      e.preventDefault();
      currentX = e.clientX - initialX;
      currentY = e.clientY - initialY;
      xOffset = currentX;
      yOffset = currentY;
      setTranslate(currentX, currentY, dragItem);
    }
  }
  function setTranslate(xPos, yPos, el) {
    el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
  }

  window.validateInput = (el, max) => {
    let val = parseInt(el.value) || 0;
    if (val > max) val = max;
    if (val < 0) val = 0;
    el.value = val.toString().padStart(2, '0');
  };

  const isLoggedIn = sessionStorage.getItem('isHostLoggedIn');
  
  if (!isLoggedIn) {
    window.location.replace('login.html');
  } else {
    const savedRoom = sessionStorage.getItem('hostRoomId');
    const savedTeamCount = sessionStorage.getItem('hostTeamCount');
    
    if (savedTeamCount) teamCount = parseInt(savedTeamCount);

    document.getElementById('setupTeamInfo').textContent = `Kuis akan dimainkan oleh ${teamCount} Tim`;

    if (savedRoom) {
      roomId = savedRoom;
      document.getElementById('setupScreen').style.display = 'none';
      mulaiHost();
    } else {
      document.getElementById('setupScreen').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
    }
  }

  window.logoutHost = () => {
    if (confirm('Logout dari Host? (Sesi Room akan berakhir)')) {
      sessionStorage.clear();
      localStorage.clear();
      signOut(auth).then(() => {
        window.location.replace('login.html');
      });
    }
  };

  window.buatRoom = () => {
    const newId = document.getElementById('newRoomId').value.trim().toUpperCase();
    if (!newId) { alert('ID Room tidak boleh kosong!'); return; }
    roomId = newId;
    sessionStorage.setItem('hostRoomId', roomId);
    document.getElementById('setupScreen').style.display = 'none';
    mulaiHost();
  };

  function mulaiHost() {
    document.getElementById('appContainer').style.display = 'flex';
    
    const headerTitle = document.querySelector('.header h1');
    if(headerTitle) headerTitle.innerHTML = `<span style="font-size:24px; font-weight:900; color:#0ea5e9;">HP</span> Host Panel <span style="color:#cbd5e1; margin:0 10px;">|</span> <span style="font-size:16px; color:#64748b;">Room: <span style="color:#0ea5e9; font-weight:bold;" id="roomIdLabel">${roomId}</span></span>`;

    onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
    const serverNow = () => Date.now() + serverOffset;

    generateQRs();
    loadDataPemain();

    let isFirstLoad = true;
    onValue(ref(db, `rooms/${roomId}/state`), snap => {
      const state = snap.val();
      const statusEl = document.getElementById('buzzerStatus');

      if (isFirstLoad) {
        isFirstLoad = false;
        if (state === null) {
          set(ref(db, `rooms/${roomId}/state`), { locked: true, team: '-', name: 'Ditutup Host' });
          return;
        }
      }

      const isLocked = state && state.locked;

      if (!isLocked) {
        statusEl.innerHTML = '<span>STATUS: TERBUKA</span> <div class="dot"></div>';
        statusEl.className = 'buzzer-status open';
        if (isPopupVisible) {
          document.getElementById('winnerPopup').style.display = 'none';
          isPopupVisible = false;
        }
      } else {
        statusEl.innerHTML = '<span>STATUS: TERKUNCI</span> <div class="dot"></div>';
        statusEl.className = 'buzzer-status locked';
        if (state.name !== 'Ditutup Host') {
          const winnerId = `Tim${state.team}_${state.name}`;
          if (!isPopupVisible || currentWinnerKey !== winnerId) {
             currentWinnerKey = winnerId;
             showWinnerPopup(state.team, state.name);
          }
        }
      }
    });

    onValue(ref(db, `rooms/${roomId}/timer`), snap => {
      const timer = snap.val();
      clearInterval(timerInterval);
      const overlay = document.getElementById('timerOverlay');
      
      if (!timer || !timer.running) { 
        overlay.style.display = 'none'; 
        isTimerHidden = false;
        lastTickSecond = -1;
        isPaused = false;
        
        document.getElementById('timerHour').disabled = false;
        document.getElementById('timerMin').disabled = false;
        document.getElementById('timerSec').disabled = false;
        return; 
      }
      
      if (!isTimerHidden) {
        overlay.style.display = 'flex';
      }
      
      overlay.classList.remove('urgent');
      const endAt = timer.startedAt + timer.duration * 1000;
      
      document.getElementById('timerHour').disabled = true;
      document.getElementById('timerMin').disabled = true;
      document.getElementById('timerSec').disabled = true;
      
      timerInterval = setInterval(() => {
        if (timer.isPaused) {
           document.getElementById('timerSec').classList.add('urgent'); 
           return; 
        }

        const remainingMs = Math.max(0, endAt - serverNow());
        const remainingSec = Math.ceil(remainingMs / 1000);
        
        const h = Math.floor(remainingMs / 3600000);
        const m = Math.floor((remainingMs % 3600000) / 60000);
        const s = Math.floor((remainingMs % 60000) / 1000);
        
        document.getElementById('timerHour').value = h.toString().padStart(2, '0');
        document.getElementById('timerMin').value = m.toString().padStart(2, '0');
        document.getElementById('timerSec').value = s.toString().padStart(2, '0');
        
        let timeString = (h > 0) 
           ? `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`
           : `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        document.getElementById('popupTimerValue').textContent = timeString;

        if (remainingMs <= 10000) {
          overlay.classList.add('urgent');
          document.getElementById('timerSec').classList.add('urgent');
        } else {
          document.getElementById('timerSec').classList.remove('urgent');
        }

        if (remainingMs <= 0) {
          clearInterval(timerInterval);
          document.getElementById('popupTimerValue').textContent = (h > 0) ? '00:00:00' : '00:00';
          playSound(200, 0.8, 1.0, 'sawtooth');
          
          document.getElementById('timerHour').disabled = false;
          document.getElementById('timerMin').disabled = false;
          document.getElementById('timerSec').disabled = false;
          return;
        }

        if (remainingSec !== lastTickSecond) {
          lastTickSecond = remainingSec;
          if (remainingSec <= 10) playSound(1200, 0.1, 1.0, 'sawtooth');
          else playSound(600, 0.05, 1.0, 'sine');
        }
      }, 100);
    });

    onValue(query(ref(db, `rooms/${roomId}/chat`), limitToLast(50)), snap => {
      const data = snap.val() || {};
      const msgs = Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      const el = document.getElementById('chatList');
      el.innerHTML = msgs.map(m => `
        <div class="chat-msg ${m.name === 'Host' ? 'host' : ''}">
          <div class="chat-who">${m.name === 'Host' ? 'HOST (Broadcast)' : `Tim ${m.team} • ${m.name}`}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      el.scrollTop = el.scrollHeight;
    });
  }

  function showWinnerPopup(team, name) {
    isPopupVisible = true;
    const popup = document.getElementById('winnerPopup');
    document.getElementById('popupTeam').textContent = `TIM ${team}`;
    document.getElementById('popupTeam').style.color = `var(--tim${team})`;
    document.getElementById('popupName').textContent = name;
    document.getElementById('popupName').style.color = `var(--tim${team})`;
    popup.style.display = 'flex';
    playHorn();
  }

  window.tutupWinnerPopup = async () => {
    document.getElementById('winnerPopup').style.display = 'none';
    isPopupVisible = false;
    currentWinnerKey = "";
    try {
      await remove(ref(db, `rooms/${roomId}/state`));
      await remove(ref(db, `rooms/${roomId}/buzzer`));
    } catch (e) { console.log(e); }
  };

    window.paksaSinkron = async (e) => {
    const btn = e ? e.currentTarget : document.activeElement;
    if(btn) { btn.innerHTML = '<i>⏳</i> Memuat'; btn.disabled = true; }
    
    try {
      // Ambil data pemain terbaru langsung dari Firebase
      const playersRef = ref(db, `rooms/${roomId}/players`);
      const snapshot = await get(playersRef);
      
      if (snapshot.exists()) {
        const players = snapshot.val();
        const teams = {1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: []};
        
        // Kelompokkan pemain berdasarkan tim
        Object.entries(players).forEach(([key, p]) => { 
          if (teams[p.team]) teams[p.team].push({ key, name: p.name }); 
        });
        
        // Render ulang ke layar
        const listEl = document.getElementById('playerList');
        listEl.innerHTML = '';
        
        for (let i = 1; i <= teamCount; i++) {
          const namesHTML = teams[i].length > 0 
            ? teams[i].map(p => `<span style="font-size:15px; color:var(--text-main); font-weight:700;">${p.name}</span> <button class="btn-del-player" onclick="hapusPemain('${p.key}')">✕</button>`).join(', ')
            : '-';
          listEl.innerHTML += `
            <div class="player-row t${i}">
              <span style="color:var(--tim${i}); min-width:50px; font-weight:900;">TIM ${i}</span>
              <span style="flex:1; text-align:left; padding:0 10px;">${namesHTML}</span>
              <span class="device-count">${teams[i].length} device</span>
            </div>
          `;
        }
      }
    } catch(err) { 
      console.error("Gagal sinkron:", err); 
    }
    
    // Kembalikan tombol ke semula setelah 1 detik
    setTimeout(() => { 
      if(btn) { btn.innerHTML = '<i>🔄</i> Sinkron'; btn.disabled = false; } 
    }, 1000);
  };

  window.minimizeTimer = () => {
    document.getElementById('timerOverlay').style.display = 'none';
    isTimerHidden = true;
  };

  window.tampilkanTimer = () => {
    document.getElementById('timerOverlay').style.display = 'flex';
    isTimerHidden = false;
  };

  let actx;
  document.addEventListener('click', () => {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }, { once: true });

  function playSound(freq = 880, dur = 0.1, vol = 1.0, type = 'sine') {
    try {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function playHorn() {
    try {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sawtooth'; 
      o.frequency.setValueAtTime(600, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(300, actx.currentTime + 0.4);
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(1.0, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);
      o.start(); o.stop(actx.currentTime + 0.5);
    } catch (e) {}
  }

  function getPlayerBaseUrl() {
    let url = window.location.origin + window.location.pathname;
    url = url.substring(0, url.lastIndexOf('/') + 1);
    return url + 'player.html';
  }

  function loadDataPemain() {
    if (playerListenerRef) playerListenerRef();
    playerListenerRef = onValue(ref(db, `rooms/${roomId}/players`), snap => {
      const players = snap.val() || {};
      const teams = {1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: []};
      Object.entries(players).forEach(([key, p]) => { if (teams[p.team]) teams[p.team].push({ key, name: p.name }); });
      
      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';
      
      for (let i = 1; i <= teamCount; i++) {
        const namesHTML = teams[i].length > 0 
          ? teams[i].map(p => `<span style="font-size:15px; color:var(--text-main); font-weight:700;">${p.name}</span> <button class="btn-del-player" onclick="hapusPemain('${p.key}')">✕</button>`).join(', ')
          : '-';
        listEl.innerHTML += `
          <div class="player-row t${i}">
            <span style="color:var(--tim${i}); min-width:50px; font-weight:900;">TIM ${i}</span>
            <span style="flex:1; text-align:left; padding:0 10px;">${namesHTML}</span>
            <span class="device-count">${teams[i].length} device</span>
          </div>
        `;
      }
    });
  }

  window.hapusChat = async () => {
    if(confirm('Hapus semua chat di room ini?')) {
      try { await remove(ref(db, `rooms/${roomId}/chat`)); } catch (error) { alert('Gagal: ' + error.message); }
    }
  };

  window.bukaBuzzer = async () => { 
    document.getElementById('winnerPopup').style.display = 'none';
    isPopupVisible = false;
    currentWinnerKey = "";
    try {
      await remove(ref(db, `rooms/${roomId}/state`)); 
      await set(ref(db, `rooms/${roomId}/buzzer`), { armed: false });
    } catch(e) { console.error(e); }
  };

  window.tutupBuzzer = async () => { 
    document.getElementById('winnerPopup').style.display = 'none';
    isPopupVisible = false;
    currentWinnerKey = "";
    try {
      await set(ref(db, `rooms/${roomId}/state`), { locked: true, team: '-', name: 'Ditutup Host' }); 
      await set(ref(db, `rooms/${roomId}/buzzer`), { armed: true });
    } catch(e) { console.error(e); }
  };

  window.resetBuzzer = async () => { 
    document.getElementById('winnerPopup').style.display = 'none';
    isPopupVisible = false;
    currentWinnerKey = "";
    try {
      await remove(ref(db, `rooms/${roomId}/state`)); 
      await remove(ref(db, `rooms/${roomId}/buzzer`));
    } catch(e) { console.error(e); }
  };

  window.hapusPemain = async (playerKey) => {
    if(confirm('Keluarkan pemain ini?')) await remove(ref(db, `rooms/${roomId}/players/${playerKey}`));
  };

  window.resetTotal = async () => {
    if(!confirm('Hapus SEMUA data di room ini?')) return;
    await remove(ref(db, `rooms/${roomId}`));
    location.reload();
  };

  window.startTimer = async () => {
    const h = parseInt(document.getElementById('timerHour').value) || 0;
    const m = parseInt(document.getElementById('timerMin').value) || 0;
    const s = parseInt(document.getElementById('timerSec').value) || 0;
    const dur = (h * 3600) + (m * 60) + s;
    
    if (dur <= 0) { alert("Waktu harus lebih dari 0 detik!"); return; }
    
    if (actx && actx.state === 'suspended') actx.resume();
    
    if (isPaused) {
      const newStartedAt = Date.now() + serverOffset - (dur * 1000) + pausedTimeRemaining;
      await set(ref(db, `rooms/${roomId}/timer`), { running: true, isPaused: false, startedAt: newStartedAt, duration: dur });
      isPaused = false;
    } else {
      isTimerHidden = false;
      xOffset = 0; yOffset = 0;
      dragItem.style.transform = `translate3d(0px, 0px, 0px)`;
      await set(ref(db, `rooms/${roomId}/timer`), { running: true, isPaused: false, startedAt: Date.now() + serverOffset, duration: dur });
    }
  };
  
  window.pauseTimer = async () => {
    if (isPaused) return;
    
    const h = parseInt(document.getElementById('timerHour').value) || 0;
    const m = parseInt(document.getElementById('timerMin').value) || 0;
    const s = parseInt(document.getElementById('timerSec').value) || 0;
    pausedTimeRemaining = (h * 3600000) + (m * 60000) + (s * 1000); 
    
    isPaused = true;
    
    await set(ref(db, `rooms/${roomId}/timer`), { 
      running: true, 
      isPaused: true, 
      startedAt: Date.now() + serverOffset, 
      duration: pausedTimeRemaining / 1000 
    });
  };

  window.stopTimer = async () => { 
    await remove(ref(db, `rooms/${roomId}/timer`));
    minimizeTimer(); 
    isPaused = false;
    
    document.getElementById('timerHour').disabled = false;
    document.getElementById('timerMin').disabled = false;
    document.getElementById('timerSec').disabled = false;
    document.getElementById('timerSec').classList.remove('urgent');

    document.getElementById('popupTimerValue').textContent = '00:00';
    
    document.getElementById('timerHour').value = '00';
    document.getElementById('timerMin').value = '00';
    document.getElementById('timerSec').value = '30';
  };

  window.kirimChatHost = async () => {
    const input = document.getElementById('hostChatInput');
    const text = input.value.trim();
    if (!text) return;
    await set(push(ref(db, `rooms/${roomId}/chat`)), { name: 'Host', team: 'ALL', text: text, ts: serverTimestamp() });
    input.value = '';
  };

  window.bukaModalQR = (teamNumber) => {
    const modal = document.getElementById('qrModal');
    const target = document.getElementById('qrModalTarget');
    document.getElementById('qrModalTitle').textContent = `Scan untuk Tim ${teamNumber}`;
    target.innerHTML = '';
    new QRCode(target, { text: `${getPlayerBaseUrl()}?room=${roomId}&team=${teamNumber}`, width: 350, height: 350, colorDark: "#000000", colorLight: "#ffffff" });
    modal.style.display = 'flex';
  };
  window.tutupModalQR = () => { document.getElementById('qrModal').style.display = 'none'; document.getElementById('qrModalTarget').innerHTML = ''; };

  function generateQRs() {
    const baseUrl = getPlayerBaseUrl();
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    for (let i = 1; i <= teamCount; i++) {
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `<h3 style="color:var(--tim${i}); font-weight:900;">TIM ${i}</h3><div class="qr-wrapper" id="qr-mini-${i}"></div><button class="btn-zoom" onclick="bukaModalQR(${i})">🔍 Perbesar</button>`;
      grid.appendChild(card);
      new QRCode(document.getElementById(`qr-mini-${i}`), { text: `${baseUrl}?room=${roomId}&team=${i}`, width: 65, height: 65, colorDark: "#000000", colorLight: "#ffffff" });
    }
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
</script>
</body>
</html>
