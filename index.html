<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host - Cerdas Cermat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; gap: 16px; min-height: 100vh;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: #1e293b; padding: 12px 20px; border-radius: 10px;
  }
  .header h1 { margin: 0; font-size: 20px; }
  .grid-container {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1;
  }
  .panel {
    background: #1e293b; border-radius: 10px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .panel-title { font-size: 14px; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin: 0 0 8px 0; letter-spacing: 1px; }
  
  /* Timer */
  .timer-display { font-size: 48px; font-weight: 800; text-align: center; color: #3b82f6; font-variant-numeric: tabular-nums; margin: 10px 0; }
  .timer-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; color: #fff; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #3b82f6; }
  .btn-success { background: #22c55e; }
  .btn-danger { background: #ef4444; }
  .btn-warning { background: #f59e0b; }
  
  /* Buzzer */
  .buzzer-status { text-align: center; font-size: 20px; font-weight: 800; padding: 12px; border-radius: 8px; border: 2px dashed #475569; }
  .buzzer-status.locked { color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
  .buzzer-status.open { color: #22c55e; border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
  
  .winner-box { font-size: 24px; font-weight: bold; text-align: center; color: #fbbf24; padding: 20px; min-height: 80px; }

  /* Players */
  .player-list { display: flex; flex-direction: column; gap: 8px; }
  .player-row { background: #0f172a; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .device-count { font-size: 12px; background: #334155; padding: 2px 8px; border-radius: 12px; color: #cbd5e1; }

  /* QR */
  .qr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .qr-card { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
  .qr-card h3 { margin: 0 0 10px 0; font-size: 14px; }
  #qr-team1, #qr-team2, #qr-team3, #qr-team4 { display: flex; justify-content: center; margin-bottom: 8px; }
  .qr-card button { width: 100%; font-size: 12px; padding: 6px; }

  /* Chat */
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 8px; }
  .chat-msg { background: #0f172a; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  .chat-msg.host { background: #1e3a8a; text-align: right; }
  .chat-who { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .chat-input { display: flex; gap: 8px; margin-top: 8px; }
  .chat-input input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #0f172a; color: white; }
  
  .input-group { display: flex; gap: 8px; align-items: center; }
  .input-group input { padding: 8px; border-radius: 6px; border: none; background: #0f172a; color: white; width: 80px; text-align: center; font-size: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>Host Panel • Room: <span id="roomIdLabel" style="color: #3b82f6;">...</span></h1>
</div>

<div class="grid-container">
  <!-- KOLOM KIRI -->
  <div style="display: flex; flex-direction: column; gap: 16px;">
    
    <!-- Panel Timer -->
    <div class="panel">
      <p class="panel-title">⏱ Timer Kuis</p>
      <div class="timer-display" id="hostTimer">—</div>
      <div class="timer-controls">
        <div class="input-group">
          <input type="number" id="timerInput" value="30" min="1" max="300"> <span>detik</span>
        </div>
        <button class="btn btn-primary" onclick="startTimer()">▶ Start</button>
        <button class="btn btn-danger" onclick="stopTimer()">■ Stop</button>
      </div>
    </div>

    <!-- Panel Buzzer -->
    <div class="panel">
      <p class="panel-title">🔔 Tombol Cepat (Buzzer)</p>
      <div class="buzzer-status" id="buzzerStatus">STATUS: MENUNGGU</div>
      <div class="winner-box" id="winnerDisplay"></div>
      <div class="timer-controls" style="margin-top: 10px;">
        <button class="btn btn-success" onclick="bukaBuzzer()">Buka Buzzer</button>
        <button class="btn btn-warning" onclick="tutupBuzzer()">Tutup & Reset</button>
      </div>
    </div>

    <!-- Panel Pemain -->
    <div class="panel">
      <p class="panel-title">👥 Pemain Terhubung</p>
      <div class="player-list" id="playerList">
        <!-- Diisi oleh JS -->
      </div>
    </div>

  </div>

  <!-- KOLOM KANAN -->
  <div style="display: flex; flex-direction: column; gap: 16px;">
    
    <!-- Panel QR Code -->
    <div class="panel">
      <p class="panel-title">📱 QR Code Registrasi</p>
      <div class="qr-grid">
        <div class="qr-card"><h3>Tim 1</h3><div id="qr-team1"></div></div>
        <div class="qr-card"><h3>Tim 2</h3><div id="qr-team2"></div></div>
        <div class="qr-card"><h3>Tim 3</h3><div id="qr-team3"></div></div>
        <div class="qr-card"><h3>Tim 4</h3><div id="qr-team4"></div></div>
      </div>
    </div>

    <!-- Panel Chat -->
    <div class="panel" style="flex: 1;">
      <p class="panel-title">💬 Live Chat & Broadcast</p>
      <div class="chat-list" id="chatList"></div>
      <div class="chat-input">
        <input id="hostChatInput" placeholder="Broadcast pesan..." onkeypress="if(event.key==='Enter')kirimChatHost()">
        <button class="btn btn-primary" onclick="kirimChatHost()">Kirim</button>
      </div>
    </div>

  </div>
</div>

<!-- Library QR Code Generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, remove, push, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ============ KONFIGURASI ============
  const firebaseConfig = {
    apiKey: "AIzaSyB98iws-cuHwi5jOftorleJ1-lwxJby0l0",
    authDomain: "cerdascermat-a3206.firebaseapp.com",
    databaseURL: "https://cerdascermat-a3206-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cerdascermat-a3206",
    storageBucket: "cerdascermat-a3206.firebasestorage.app",
    messagingSenderId: "1098230358098",
    appId: "1:1098230358098:web:301f0f0d25b220de75ff8b"
  };
  // =====================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // Ganti room default jika perlu
  const params = new URLSearchParams(location.search);
  const roomId = (params.get('room') || 'CCA2026').toUpperCase();
  document.getElementById('roomIdLabel').textContent = roomId;

  let serverOffset = 0;
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  const serverNow = () => Date.now() + serverOffset;

  let timerInterval = null;

  // Login Host secara anonim
  signInAnonymously(auth).then(() => {
    initHost();
  }).catch(e => alert('Gagal login Host: ' + e.message));

  function initHost() {
    // 1. Generate QR Code
    generateQRs();

    // 2. Listen State (Buzzer & Pemenang)
    onValue(ref(db, `rooms/${roomId}/state`), snap => {
      const state = snap.val();
      const statusEl = document.getElementById('buzzerStatus');
      const winnerEl = document.getElementById('winnerDisplay');

      if (!state || !state.locked) {
        statusEl.textContent = 'STATUS: TERBUKA';
        statusEl.className = 'buzzer-status open';
        winnerEl.innerHTML = '';
      } else {
        statusEl.textContent = 'STATUS: TERKUNCI';
        statusEl.className = 'buzzer-status locked';
        winnerEl.innerHTML = `🏆 <span style="color:#22c55e">Tim ${state.team}</span> (${state.name}) lebih cepat!`;
      }
    });

    // 3. Listen Timer
    onValue(ref(db, `rooms/${roomId}/timer`), snap => {
      const timer = snap.val();
      clearInterval(timerInterval);
      const el = document.getElementById('hostTimer');
      
      if (!timer || !timer.running) {
        el.textContent = '—';
        return;
      }
      const endAt = timer.startedAt + timer.duration * 1000;
      const tick = () => {
        const remaining = Math.max(0, endAt - serverNow());
        el.textContent = (remaining / 1000).toFixed(1);
        if (remaining <= 0) {
          el.textContent = 'WAKTU HABIS!';
          clearInterval(timerInterval);
        }
      };
      tick();
      timerInterval = setInterval(tick, 100);
    });

    // 4. Listen Players
    onValue(ref(db, `rooms/${roomId}/players`), snap => {
      const players = snap.val() || {};
      const teams = {1: [], 2: [], 3: [], 4: []};
      
      Object.values(players).forEach(p => {
        if (teams[p.team]) teams[p.team].push(p.name);
      });

      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        const names = teams[i].join(', ') || '-';
        listEl.innerHTML += `
          <div class="player-row">
            <span>Tim ${i}</span>
            <span>${names}</span>
            <span class="device-count">${teams[i].length} device</span>
          </div>
        `;
      }
    });

    // 5. Listen Chat
    onValue(query(ref(db, `rooms/${roomId}/chat`), limitToLast(50)), snap => {
      const data = snap.val() || {};
      const msgs = Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      const el = document.getElementById('chatList');
      el.innerHTML = msgs.map(m => `
        <div class="chat-msg ${m.name === 'Host' ? 'host' : ''}">
          <div class="chat-who">Tim ${m.team} • ${m.name}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      el.scrollTop = el.scrollHeight;
    });
  }

  // ============ FUNGSI TOMBOL ============

  window.bukaBuzzer = async () => {
    await remove(ref(db, `rooms/${roomId}/state`));
  };

  window.tutupBuzzer = async () => {
    await remove(ref(db, `rooms/${roomId}/state`));
  };

  window.startTimer = async () => {
    const dur = parseInt(document.getElementById('timerInput').value) || 30;
    await set(ref(db, `rooms/${roomId}/timer`), {
      running: true,
      startedAt: serverNow(),
      duration: dur
    });
  };

  window.stopTimer = async () => {
    await remove(ref(db, `rooms/${roomId}/timer`));
  };

  window.kirimChatHost = async () => {
    const input = document.getElementById('hostChatInput');
    const text = input.value.trim();
    if (!text) return;
    await set(push(ref(db, `rooms/${roomId}/chat`)), {
      name: 'Host',
      team: 'ALL',
      text: text,
      ts: serverTimestamp()
    });
    input.value = '';
  };

  // ============ UTILS ============
  function generateQRs() {
    const baseUrl = window.location.href.split('?')[0].replace('index.html', 'player.html').replace('host.html', 'player.html');
    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById(`qr-team${i}`);
      el.innerHTML = '';
      new QRCode(el, {
        text: `${baseUrl}?room=${roomId}&team=${i}`,
        width: 120, height: 120,
        colorDark: "#000000", colorLight: "#ffffff",
      });
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
</script>
</body>
</html>
