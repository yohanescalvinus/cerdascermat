<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Host - Cerdas Cermat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg-main: #f1f5f9; --bg-panel: #ffffff; --bg-card: #f8fafc;
    --text-main: #0f172a; --text-muted: #475569; --border-color: #cbd5e1;
    --tim1: #ef4444; --tim2: #3b82f6; --tim3: #22c55e; --tim4: #a855f7;
    --tim5: #f97316; --tim6: #14b8a6; --tim7: #ec4899; --tim8: #84cc16;
  }

  html, body {
    height: 100vh; width: 100vw; overflow: hidden; 
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-main); color: var(--text-main);
  }

  /* LAYAR SETUP ROOM */
  #setupScreen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; width: 100vw; padding: 20px; background: var(--bg-main);
    position: fixed; top: 0; left: 0; z-index: 1000;
  }
  .login-box {
    background: var(--bg-panel); padding: 40px; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 2px solid var(--border-color);
    width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px;
  }
  .login-box h1 { text-align: center; color: #3b82f6; margin-bottom: 5px; font-size: 32px;}
  .login-box p { text-align: center; font-size: 18px; color: var(--text-muted); margin-bottom: 10px; }
  .login-box input {
    padding: 16px; border-radius: 10px; border: 2px solid var(--border-color);
    font-size: 24px; font-weight: bold; background: var(--bg-main); color: var(--text-main); outline: none; text-align: center; letter-spacing: 2px;
  }
  .login-box input:focus { border-color: #3b82f6; }
  .login-box button {
    padding: 16px; border-radius: 10px; border: none; background: #3b82f6; color: white;
    font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .login-box button:hover { background: #2563eb; }
  .btn-logout-setup { background: #ef4444 !important; margin-top: 10px; font-size: 16px !important;}
  .team-info-badge { text-align: center; font-size: 20px; font-weight: bold; color: #0f172a; background: #e0e7ff; padding: 12px; border-radius: 8px; margin-bottom: 10px;}

  /* PANEL HOST UTAMA */
  #appContainer { display: none; flex-direction: column; height: 100%; padding: 16px; gap: 16px; }
  
  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-panel); padding: 16px 24px; border-radius: 12px; flex-shrink: 0;
    border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 10;
  }
  .header h1 { font-size: 32px; margin: 0; display: flex; align-items: center; gap: 12px; font-weight: 800; }
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .btn-sm { padding: 12px 20px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; color: white; transition: 0.2s;}
  .btn-blue { background: #3b82f6; } .btn-red { background: #ef4444; } .btn-gray { background: #64748b; } .btn-orange { background: #f59e0b; }
  
  .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  .column { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .panel {
    background: var(--bg-panel); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; position: relative;
    border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .panel-title { font-size: 18px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; flex-shrink: 0;}

  /* ========================================== */
  /* PERUBAHAN LAYOUT: TIMER & BUZZER COMPACT   */
  /* ========================================== */
  .timer-panel { flex: 0 0 auto; } /* Timer menyesuaikan isinya, tidak memaksa tinggi */
  .input-group { display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; flex-wrap: wrap;}
  .input-group input { padding: 12px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--bg-card); color: var(--text-main); width: 100px; text-align: center; font-size: 28px; font-weight: 800;}

  .buzzer-panel { flex: 0 0 auto; }
  /* Membuat Buzzer menjadi baris horizontal */
  .buzzer-content { display: flex; align-items: center; gap: 16px; width: 100%; }
  .buzzer-status { flex: 1; text-align: center; font-size: 28px; font-weight: 900; padding: 16px; border-radius: 12px; border: 4px dashed var(--border-color); transition: 0.3s; letter-spacing: 2px;}
  .buzzer-status.locked { color: #ef4444; border-color: #ef4444; background: #fee2e2; }
  .buzzer-status.open { color: #16a34a; border-color: #22c55e; background: #dcfce7; }
  .winner-box { font-size: 28px; font-weight: 900; text-align: center; color: #d97706; margin: 0 0 10px 0; min-height: 35px;}
  .btn-group { display: flex; gap: 10px; flex-direction: column; }
  .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 800; font-size: 18px; color: #fff; transition: 0.2s;}
  .btn-primary { background: #3b82f6; } .btn-success { background: #22c55e; } .btn-warning { background: #f59e0b; } .btn-danger { background: #ef4444; }

  /* PEMain Flexbox: Memakan semua sisa layar */
  .player-panel { flex: 1; overflow: hidden; }
  .player-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 8px; flex: 1;}
  .player-row { background: var(--bg-card); padding: 16px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; border: 2px solid var(--border-color); border-left: 8px solid transparent; }
  
  .player-row.t1 { border-left-color: var(--tim1); } .player-row.t2 { border-left-color: var(--tim2); }
  .player-row.t3 { border-left-color: var(--tim3); } .player-row.t4 { border-left-color: var(--tim4); }
  .player-row.t5 { border-left-color: var(--tim5); } .player-row.t6 { border-left-color: var(--tim6); }
  .player-row.t7 { border-left-color: var(--tim7); } .player-row.t8 { border-left-color: var(--tim8); }

  .device-count { font-size: 16px; background: var(--border-color); padding: 6px 14px; border-radius: 20px; color: var(--text-main); white-space: nowrap; font-weight: 800;}
  .btn-del-player { background: #ef4444; color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px; margin-left: 10px; font-weight: bold;}

  /* QR & CHAT tetap */
  .qr-panel { flex-shrink: 0; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; }
  .qr-card { background: var(--bg-card); padding: 12px; border-radius: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid var(--border-color);}
  .qr-card h3 { margin: 0; font-size: 18px; }
  .qr-wrapper { background: #ffffff; padding: 8px; border-radius: 10px; display: inline-block; border: 1px solid #e2e8f0;}
  .qr-wrapper canvas, .qr-wrapper img { width: 90px !important; height: 90px !important; cursor: pointer; display: block;}
  .btn-zoom { background: #64748b; color: white; font-size: 14px; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; width: 100%; font-weight: bold;}

  #qrModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.9); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 30px;}
  #qrModal .qr-wrapper { padding: 30px; border-radius: 16px; }
  #qrModal canvas, #qrModal img { width: 400px !important; height: 400px !important;}
  #qrModal h2 { color: white; margin: 0; font-size: 48px;}

  #timerOverlay {
    display: none; position: fixed; top: 0; left: 0; width: 65vw; height: 100vh; 
    background: rgba(255, 255, 255, 0.98); z-index: 500;
    flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);
    box-shadow: 2px 0 15px rgba(0,0,0,0.2);
  }
  .btn-close-overlay {
    position: absolute; top: 30px; right: 30px; background: #e2e8f0; color: #0f172a; border: none;
    width: 60px; height: 60px; border-radius: 50%; font-size: 30px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .btn-close-overlay:hover { background: #cbd5e1; }
  #timerOverlay h1 { font-size: 48px; color: var(--text-muted); margin-bottom: -10px; font-weight: 800; letter-spacing: 2px;}
  #popupTimerValue { font-size: 20vw; max-width: 100%; font-weight: 900; color: #3b82f6; font-variant-numeric: tabular-nums; line-height: 1; transition: color 0.3s, transform 0.1s; }
  #timerOverlay.urgent #popupTimerValue { color: #ef4444; transform: scale(1.05); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  .chat-panel { flex: 1; min-height: 0; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 8px; }
  .chat-msg { background: var(--bg-card); padding: 12px 16px; border-radius: 8px; font-size: 18px; max-width: 90%; border: 1px solid var(--border-color);}
  .chat-msg.host { background: #e0e7ff; color: #1e3a8a; align-self: flex-end; text-align: right; border-color: #c7d2fe;}
  .chat-who { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; font-weight: 800;}
  .chat-msg.host .chat-who { color: #4338ca; }
  .chat-input { display: flex; gap: 10px; margin-top: 10px; flex-shrink: 0;}
  .chat-input input { flex: 1; padding: 16px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 18px;}
</style>
</head>
<body>

<!-- LAYAR SETUP ROOM -->
<div id="setupScreen">
  <div class="login-box">
    <h1>📝 Buat Room</h1>
    <p>Masukkan ID Room (tanpa spasi)</p>
    
    <div class="team-info-badge" id="setupTeamInfo">Menunggu data tim...</div>

    <input type="text" id="newRoomId" placeholder="CONTOH: CCA2026" value="CCA2026" style="text-transform: uppercase;">
    <button onclick="buatRoom()">Buat & Mulai Kuis</button>
    <button class="btn-logout-setup" onclick="logoutHost()">Logout</button>
  </div>
</div>

<!-- PANEL HOST UTAMA -->
<div id="appContainer">
  <div class="header">
    <h1>Host Panel <span style="color:var(--border-color)">|</span> Room: <span id="roomIdLabel" style="color: #3b82f6;">...</span></h1>
    <div class="header-actions">
      <button class="btn-sm btn-orange" onclick="paksaSinkron()">🔄 Paksa Sinkron</button>
      <button class="btn-sm btn-blue" onclick="if(confirm('Hapus semua chat?')) remove(ref(db, 'rooms/'+roomId+'/chat'))">Hapus Chat</button>
      <button class="btn-sm btn-red" onclick="resetTotal()">Reset Total</button>
      <button class="btn-sm btn-gray" onclick="logoutHost()">Logout</button>
    </div>
  </div>

  <div class="grid-container">
    <!-- KOLOM KIRI -->
    <div class="column">
      
      <!-- TIMER (COMPACT) -->
      <div class="panel timer-panel">
        <p class="panel-title">⏱ Timer Kuis</p>
        <div class="input-group">
          <input type="number" id="timerInput" value="30" min="1" max="300"> <span>detik</span>
          <button class="btn btn-primary" onclick="startTimer()">▶ Start</button>
          <button class="btn btn-warning" onclick="tampilkanTimer()" id="btnShowTimer" style="display:none;">👁️ Tampilkan</button>
          <button class="btn btn-danger" onclick="stopTimer()">■ Stop</button>
        </div>
      </div>

      <!-- BUZZER (COMPACT) -->
      <div class="panel buzzer-panel">
        <p class="panel-title">🔔 Tombol Cepat (Buzzer)</p>
        <div class="winner-box" id="winnerDisplay"></div>
        <div class="buzzer-content">
          <div class="buzzer-status" id="buzzerStatus">STATUS: —</div>
          <div class="btn-group">
            <button class="btn btn-success" onclick="bukaBuzzer()">Buka</button>
            <button class="btn btn-warning" onclick="tutupBuzzer()">Tutup</button>
            <button class="btn btn-danger" onclick="resetBuzzer()">Reset</button>
          </div>
        </div>
      </div>

      <!-- PEMAIN (FLEXIBLE, MEMAKAN SISA RUANG) -->
      <div class="panel player-panel">
        <p class="panel-title">👥 Pemain Terhubung</p>
        <div class="player-list" id="playerList"></div>
      </div>
    </div>

    <!-- KOLOM KANAN -->
    <div class="column">
      <div class="panel qr-panel">
        <p class="panel-title">📱 QR Code Registrasi Tim</p>
        <div class="qr-grid" id="qrGrid"></div>
      </div>

      <div class="panel chat-panel">
        <p class="panel-title">💬 Live Chat & Broadcast</p>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-input">
          <input id="hostChatInput" placeholder="Ketik pesan untuk semua pemain..." onkeypress="if(event.key==='Enter')kirimChatHost()">
          <button class="btn btn-primary" onclick="kirimChatHost()">Kirim</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- OVERLAY TIMER -->
<div id="timerOverlay">
  <button class="btn-close-overlay" onclick="sembunyikanTimer()">✕</button>
  <h1>SISA WAKTU</h1>
  <div id="popupTimerValue">—</div>
  <button class="btn btn-danger" onclick="stopTimer()" style="margin-top: 40px; padding: 20px 40px; font-size: 28px; border-radius: 12px;">■ Hentikan Waktu</button>
</div>

<!-- MODAL QR -->
<div id="qrModal" onclick="tutupModalQR()">
  <h2 id="qrModalTitle">Tim 1</h2>
  <div class="qr-wrapper" id="qrModalTarget"></div>
  <p style="color:#cbd5e1; font-size:24px;">Klik di mana saja untuk menutup</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, remove, push, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB98iws-cuHwi5jOftorleJ1-lwxJby0l0",
    authDomain: "cerdascermat-a3206.firebaseapp.com",
    databaseURL: "https://cerdascermat-a3206-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cerdascermat-a3206",
    storageBucket: "cerdascermat-a3206.firebasestorage.app",
    messagingSenderId: "1098230358098",
    appId: "1:1098230358098:web:301f0f0d25b220de75ff8b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let roomId = '';
  let teamCount = 4; 
  let serverOffset = 0;
  let timerInterval = null;
  let lastTickSecond = -1;
  let playerListenerRef = null;
  let isTimerHidden = false;

  const isLoggedIn = sessionStorage.getItem('isHostLoggedIn');
  
  if (!isLoggedIn) {
    window.location.replace('login.html');
  } else {
    const savedRoom = sessionStorage.getItem('hostRoomId');
    const savedTeamCount = sessionStorage.getItem('hostTeamCount');
    
    if (savedTeamCount) teamCount = parseInt(savedTeamCount);

    document.getElementById('setupTeamInfo').textContent = `Kuis akan dimainkan oleh ${teamCount} Tim`;

    if (savedRoom) {
      roomId = savedRoom;
      document.getElementById('setupScreen').style.display = 'none';
      mulaiHost();
    } else {
      document.getElementById('setupScreen').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
    }
  }

  window.logoutHost = () => {
    if (confirm('Logout dari Host? (Sesi Room akan berakhir)')) {
      sessionStorage.clear();
      localStorage.clear();
      signOut(auth).then(() => {
        window.location.replace('login.html');
      });
    }
  };

  window.buatRoom = () => {
    const newId = document.getElementById('newRoomId').value.trim().toUpperCase();
    if (!newId) { alert('ID Room tidak boleh kosong!'); return; }
    roomId = newId;
    sessionStorage.setItem('hostRoomId', roomId);
    document.getElementById('setupScreen').style.display = 'none';
    mulaiHost();
  };

  function mulaiHost() {
    document.getElementById('appContainer').style.display = 'flex';
    
    const headerTitle = document.querySelector('.header h1');
    if(headerTitle) headerTitle.innerHTML = `Host Panel <span style="color:var(--border-color)">|</span> Room: <span id="roomIdLabel" style="color: #3b82f6;">${roomId}</span> <span style="color:var(--text-muted); font-size: 24px; margin-left: 10px;">(${teamCount} Tim)</span>`;

    onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
    const serverNow = () => Date.now() + serverOffset;

    generateQRs();
    loadDataPemain();

    let prevLocked = null;
    onValue(ref(db, `rooms/${roomId}/state`), snap => {
      const state = snap.val();
      const statusEl = document.getElementById('buzzerStatus');
      const winnerEl = document.getElementById('winnerDisplay');
      const isLocked = state && state.locked;

      if (!isLocked) {
        statusEl.textContent = 'STATUS: TERBUKA';
        statusEl.className = 'buzzer-status open';
        winnerEl.innerHTML = '';
        if (prevLocked === true) playSound(800, 0.3, 1.0, 'square');
      } else {
        statusEl.textContent = 'STATUS: TERKUNCI';
        statusEl.className = 'buzzer-status locked';
        if (state.name === 'Ditutup Host') {
          winnerEl.innerHTML = `🔒 Buzzer Ditutup Manual`;
          if (prevLocked === false) playSound(300, 0.3, 1.0, 'square');
        } else {
          winnerEl.innerHTML = `🏆 <span style="color:var(--tim${state.team}); font-weight:900;">TIM ${state.team}</span> (${state.name})!`;
          if (prevLocked === false) playHorn();
        }
      }
      prevLocked = isLocked;
    });

    onValue(ref(db, `rooms/${roomId}/timer`), snap => {
      const timer = snap.val();
      clearInterval(timerInterval);
      const overlay = document.getElementById('timerOverlay');
      const btnShow = document.getElementById('btnShowTimer');
      
      if (!timer || !timer.running) { 
        overlay.style.display = 'none'; 
        btnShow.style.display = 'none';
        isTimerHidden = false;
        lastTickSecond = -1;
        return; 
      }
      
      if (!isTimerHidden) {
        overlay.style.display = 'flex';
        btnShow.style.display = 'none';
      }
      
      overlay.classList.remove('urgent');
      const endAt = timer.startedAt + timer.duration * 1000;
      
      timerInterval = setInterval(() => {
        const remainingMs = Math.max(0, endAt - serverNow());
        const remainingSec = Math.ceil(remainingMs / 1000);
        
        document.getElementById('popupTimerValue').textContent = (remainingMs / 1000).toFixed(1);
        if (remainingMs <= 10000) overlay.classList.add('urgent');

        if (remainingMs <= 0) {
          clearInterval(timerInterval);
          document.getElementById('popupTimerValue').textContent = '0.0';
          playSound(200, 0.8, 1.0, 'sawtooth');
          return;
        }

        if (remainingSec !== lastTickSecond) {
          lastTickSecond = remainingSec;
          if (remainingSec <= 10) playSound(1200, 0.1, 1.0, 'sawtooth');
          else playSound(600, 0.05, 1.0, 'sine');
        }
      }, 100);
    });

    onValue(query(ref(db, `rooms/${roomId}/chat`), limitToLast(50)), snap => {
      const data = snap.val() || {};
      const msgs = Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      const el = document.getElementById('chatList');
      el.innerHTML = msgs.map(m => `
        <div class="chat-msg ${m.name === 'Host' ? 'host' : ''}">
          <div class="chat-who">${m.name === 'Host' ? 'HOST (Broadcast)' : `Tim ${m.team} • ${m.name}`}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      el.scrollTop = el.scrollHeight;
    });
  }

  window.sembunyikanTimer = () => {
    document.getElementById('timerOverlay').style.display = 'none';
    document.getElementById('btnShowTimer').style.display = 'inline-block';
    isTimerHidden = true;
  };

  window.tampilkanTimer = () => {
    document.getElementById('timerOverlay').style.display = 'flex';
    document.getElementById('btnShowTimer').style.display = 'none';
    isTimerHidden = false;
  };

  let actx;
  document.addEventListener('click', () => {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }, { once: true });

  function playSound(freq = 880, dur = 0.1, vol = 1.0, type = 'sine') {
    try {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function playHorn() {
    try {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sawtooth'; 
      o.frequency.setValueAtTime(600, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(300, actx.currentTime + 0.4);
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(1.0, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);
      o.start(); o.stop(actx.currentTime + 0.5);
    } catch (e) {}
  }

  function getPlayerBaseUrl() {
    let url = window.location.origin + window.location.pathname;
    url = url.substring(0, url.lastIndexOf('/') + 1);
    return url + 'player.html';
  }

  function loadDataPemain() {
    if (playerListenerRef) playerListenerRef();
    playerListenerRef = onValue(ref(db, `rooms/${roomId}/players`), snap => {
      const players = snap.val() || {};
      const teams = {1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: []};
      Object.entries(players).forEach(([key, p]) => { if (teams[p.team]) teams[p.team].push({ key, name: p.name }); });
      
      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';
      
      for (let i = 1; i <= teamCount; i++) {
        const namesHTML = teams[i].length > 0 
          ? teams[i].map(p => `<span style="font-size:20px; color:var(--text-main); font-weight:700;">${p.name}</span> <button class="btn-del-player" onclick="hapusPemain('${p.key}')">✕</button>`).join(', ')
          : '-';
        listEl.innerHTML += `
          <div class="player-row t${i}">
            <span style="color:var(--tim${i}); min-width:80px; font-weight:900;">TIM ${i}</span>
            <span style="flex:1; text-align:left; padding:0 15px;">${namesHTML}</span>
            <span class="device-count">${teams[i].length} device</span>
          </div>
        `;
      }
    });
  }

  window.paksaSinkron = () => {
    const btn = event.target;
    btn.textContent = '⏳ Memuat...';
    loadDataPemain();
    setTimeout(() => { btn.textContent = '🔄 Paksa Sinkron'; }, 800);
  };

  window.bukaBuzzer = async () => { 
    await remove(ref(db, `rooms/${roomId}/state`)); 
    await set(ref(db, `rooms/${roomId}/buzzer`), { armed: false });
  };

  window.tutupBuzzer = async () => { 
    await set(ref(db, `rooms/${roomId}/state`), { locked: true, team: '-', name: 'Ditutup Host' }); 
    await set(ref(db, `rooms/${roomId}/buzzer`), { armed: true });
  };

  window.resetBuzzer = async () => { 
    await remove(ref(db, `rooms/${roomId}/state`)); 
    await remove(ref(db, `rooms/${roomId}/buzzer`));
  };
  
  window.hapusPemain = async (playerKey) => {
    if(confirm('Keluarkan pemain ini?')) await remove(ref(db, `rooms/${roomId}/players/${playerKey}`));
  };

  window.resetTotal = async () => {
    if(!confirm('Hapus SEMUA data di room ini?')) return;
    await remove(ref(db, `rooms/${roomId}`));
    location.reload();
  };

  window.startTimer = async () => {
    const dur = parseInt(document.getElementById('timerInput').value) || 30;
    if (actx && actx.state === 'suspended') actx.resume();
    isTimerHidden = false;
    await set(ref(db, `rooms/${roomId}/timer`), { running: true, startedAt: Date.now() + serverOffset, duration: dur });
  };
  
  window.stopTimer = async () => { await remove(ref(db, `rooms/${roomId}/timer`)); };

  window.kirimChatHost = async () => {
    const input = document.getElementById('hostChatInput');
    const text = input.value.trim();
    if (!text) return;
    await set(push(ref(db, `rooms/${roomId}/chat`)), { name: 'Host', team: 'ALL', text: text, ts: serverTimestamp() });
    input.value = '';
  };

  window.bukaModalQR = (teamNumber) => {
    const modal = document.getElementById('qrModal');
    const target = document.getElementById('qrModalTarget');
    document.getElementById('qrModalTitle').textContent = `Scan untuk Tim ${teamNumber}`;
    target.innerHTML = '';
    new QRCode(target, { text: `${getPlayerBaseUrl()}?room=${roomId}&team=${teamNumber}`, width: 400, height: 400, colorDark: "#000000", colorLight: "#ffffff" });
    modal.style.display = 'flex';
  };
  window.tutupModalQR = () => { document.getElementById('qrModal').style.display = 'none'; document.getElementById('qrModalTarget').innerHTML = ''; };

  function generateQRs() {
    const baseUrl = getPlayerBaseUrl();
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    for (let i = 1; i <= teamCount; i++) {
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `<h3 style="color:var(--tim${i}); font-weight:900;">TIM ${i}</h3><div class="qr-wrapper" id="qr-mini-${i}"></div><button class="btn-zoom" onclick="bukaModalQR(${i})">🔍 Perbesar</button>`;
      grid.appendChild(card);
      new QRCode(document.getElementById(`qr-mini-${i}`), { text: `${baseUrl}?room=${roomId}&team=${i}`, width: 90, height: 90, colorDark: "#000000", colorLight: "#ffffff" });
    }
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
</script>
</body>
</html>
