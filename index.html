<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Host - Cerdas Cermat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* TEMA WARNA (Default: Dark) */
  :root {
    --bg-main: #0f172a;
    --bg-panel: #1e293b;
    --bg-card: #0f172a;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --border-color: #334155;
  }

  /* TEMA TERANG */
  body.light-mode {
    --bg-main: #f1f5f9;
    --bg-panel: #ffffff;
    --bg-card: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-color: #cbd5e1;
  }

  html, body {
    height: 100vh; width: 100vw; overflow: hidden; 
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-main); color: var(--text-main);
    transition: background 0.3s, color 0.3s;
  }

  .app-container {
    display: flex; flex-direction: column;
    height: 100%; padding: 12px; gap: 12px;
  }

  /* HEADER */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-panel); padding: 10px 16px; border-radius: 10px; flex-shrink: 0;
    border: 1px solid var(--border-color);
  }
  .header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; color: var(--text-main);}
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; color: white; transition: 0.2s;}
  
  .btn-blue { background: #3b82f6; } .btn-blue:hover { background: #2563eb; }
  .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
  .btn-gray { background: #475569; } .btn-gray:hover { background: #334155; }
  .btn-toggle { background: #8b5cf6; } .btn-toggle:hover { background: #7c3aed; }
  
  /* LAYOUT UTAMA */
  .grid-container {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 0; 
  }
  .column { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .panel {
    background: var(--bg-panel); border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; position: relative;
    border: 1px solid var(--border-color);
  }
  .panel-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0;}
  
  /* TOMBOL UTAMA */
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; color: #fff; transition: 0.2s;}
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: #3b82f6; }
  .btn-success { background: #22c55e; }
  .btn-warning { background: #f59e0b; }
  .btn-danger { background: #ef4444; }
  .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* TIMER */
  .timer-panel { flex: 0.8; justify-content: center; }
  .timer-display { font-size: 48px; font-weight: 800; text-align: center; color: #3b82f6; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .input-group { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; color: var(--text-main);}
  .input-group input { padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); width: 60px; text-align: center; font-size: 16px; font-weight: bold;}

  /* BUZZER */
  .buzzer-panel { flex: 0.9; justify-content: center; }
  .buzzer-status { text-align: center; font-size: 20px; font-weight: 800; padding: 12px; border-radius: 8px; border: 2px dashed var(--border-color); transition: 0.3s;}
  .buzzer-status.locked { color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
  .buzzer-status.open { color: #22c55e; border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
  .winner-box { font-size: 22px; font-weight: bold; text-align: center; color: #fbbf24; min-height: 30px; margin: 8px 0; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);}

  /* PEMAIN */
  .player-panel { flex: 1.5; overflow: hidden; }
  .player-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 4px; flex: 1;}
  .player-row { background: var(--bg-card); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; border: 1px solid var(--border-color); border-left: 4px solid transparent; }
  .player-row.t1 { border-left-color: #ef4444; } .player-row.t2 { border-left-color: #3b82f6; }
  .player-row.t3 { border-left-color: #f59e0b; } .player-row.t4 { border-left-color: #22c55e; }
  .device-count { font-size: 11px; background: var(--border-color); padding: 4px 10px; border-radius: 12px; color: var(--text-main); white-space: nowrap;}
  .btn-del-player { background: #ef4444; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 11px; margin-left: 6px; }
  
  /* QR CODE */
  .qr-panel { flex-shrink: 0; }
  .qr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .qr-card { background: var(--bg-card); padding: 10px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid var(--border-color);}
  .qr-card h3 { margin: 0; font-size: 13px; color: var(--text-main);}
  
  /* Kotak putih pelindung QR agar kamera HP mudah scan */
  .qr-wrapper { background: #ffffff; padding: 8px; border-radius: 8px; display: inline-block; }
  .qr-wrapper canvas, .qr-wrapper img { width: 80px !important; height: 80px !important; cursor: pointer; display: block;}
  .btn-zoom { background: #475569; color: white; font-size: 10px; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; width: 100%;}
  
  /* MODAL ZOOM QR */
  #qrModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 20px;}
  #qrModal .qr-wrapper { padding: 20px; border-radius: 12px; }
  #qrModal canvas, #qrModal img { width: 300px !important; height: 300px !important;}
  #qrModal h2 { color: white; margin: 0; font-size: 28px;}

  /* CHAT */
  .chat-panel { flex: 1; min-height: 0; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .chat-msg { background: var(--bg-card); padding: 8px 12px; border-radius: 6px; font-size: 13px; max-width: 90%; border: 1px solid var(--border-color);}
  .chat-msg.host { background: #1e3a8a; color: white; align-self: flex-end; text-align: right; border: none;}
  .chat-who { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600;}
  .chat-msg.host .chat-who { color: #93c5fd; }
  .chat-input { display: flex; gap: 6px; margin-top: 6px; flex-shrink: 0;}
  .chat-input input { flex: 1; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 13px;}
</style>
</head>
<body>

<!-- MODAL ZOOM QR -->
<div id="qrModal" onclick="tutupModalQR()">
  <h2 id="qrModalTitle">Tim 1</h2>
  <div class="qr-wrapper" id="qrModalTarget"></div>
  <p style="color:#94a3b8; font-size:14px;">Klik di mana saja untuk menutup</p>
</div>

<div class="app-container">
  <div class="header">
    <h1>Host Panel <span style="color:var(--border-color)">|</span> Room: <span id="roomIdLabel" style="color: #3b82f6;">...</span></h1>
    <div class="header-actions">
      <button class="btn-sm btn-toggle" onclick="toggleTheme()" id="btnTheme">☀️ Light Mode</button>
      <button class="btn-sm btn-blue" onclick="if(confirm('Hapus semua chat?')) remove(ref(db, 'rooms/'+roomId+'/chat'))">Hapus Chat</button>
      <button class="btn-sm btn-red" onclick="resetTotal()">Reset Total</button>
      <button class="btn-sm btn-gray" onclick="exitHost()">✕ Keluar</button>
    </div>
  </div>

  <div class="grid-container">
    <!-- KOLOM KIRI -->
    <div class="column">
      <div class="panel timer-panel">
        <p class="panel-title">⏱ Timer Kuis</p>
        <div class="timer-display" id="hostTimer">—</div>
        <div class="input-group">
          <input type="number" id="timerInput" value="30" min="1" max="300"> <span>detik</span>
          <button class="btn btn-primary" onclick="startTimer()">▶ Start</button>
          <button class="btn btn-danger" onclick="stopTimer()">■ Stop</button>
        </div>
      </div>

      <div class="panel buzzer-panel">
        <p class="panel-title">🔔 Tombol Cepat (Buzzer)</p>
        <div class="buzzer-status" id="buzzerStatus">STATUS: —</div>
        <div class="winner-box" id="winnerDisplay"></div>
        <div class="btn-group">
          <button class="btn btn-success" onclick="bukaBuzzer()">Buka</button>
          <button class="btn btn-warning" onclick="tutupBuzzer()">Tutup</button>
          <button class="btn btn-danger" onclick="resetBuzzer()">Reset</button>
        </div>
      </div>

      <div class="panel player-panel">
        <p class="panel-title">👥 Pemain Terhubung</p>
        <div class="player-list" id="playerList"></div>
      </div>
    </div>

    <!-- KOLOM KANAN -->
    <div class="column">
      <div class="panel qr-panel">
        <p class="panel-title">📱 QR Code Registrasi Tim</p>
        <div class="qr-grid" id="qrGrid">
          <!-- Diisi JS -->
        </div>
      </div>

      <div class="panel chat-panel">
        <p class="panel-title">💬 Live Chat & Broadcast</p>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-input">
          <input id="hostChatInput" placeholder="Ketik pesan untuk semua pemain..." onkeypress="if(event.key==='Enter')kirimChatHost()">
          <button class="btn btn-primary" onclick="kirimChatHost()">Kirim</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, remove, push, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB98iws-cuHwi5jOftorleJ1-lwxJby0l0",
    authDomain: "cerdascermat-a3206.firebaseapp.com",
    databaseURL: "https://cerdascermat-a3206-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cerdascermat-a3206",
    storageBucket: "cerdascermat-a3206.firebasestorage.app",
    messagingSenderId: "1098230358098",
    appId: "1:1098230358098:web:301f0f0d25b220de75ff8b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const params = new URLSearchParams(location.search);
  const roomId = (params.get('room') || 'CCA2026').toUpperCase();
  document.getElementById('roomIdLabel').textContent = roomId;

  let serverOffset = 0;
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  const serverNow = () => Date.now() + serverOffset;

  let timerInterval = null;

  // ============ FITUR TEMA (DARK / LIGHT) ============
  window.toggleTheme = () => {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    document.getElementById('btnTheme').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
    localStorage.setItem('cc_theme', isLight ? 'light' : 'dark');
  };
  
  if (localStorage.getItem('cc_theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('btnTheme').textContent = '🌙 Dark Mode';
  }

  // ============ FUNGSI URL PLAYER YANG KEBAL GITHUB ============
  function getPlayerBaseUrl() {
    // Mengambil origin (https://domain.com) dan path (folder)
    let url = window.location.origin + window.location.pathname;
    // Hapus nama file html di belakang jika ada (misal /index.html atau /host.html)
    url = url.substring(0, url.lastIndexOf('/') + 1);
    // Gabungkan dengan player.html
    return url + 'player.html';
  }

  // Audio Context untuk Suara Host
  let actx;
  function playHorn() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(800, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(400, actx.currentTime + 0.3);
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);
      o.start(); o.stop(actx.currentTime + 0.5);
    } catch (e) {}
  }

  signInAnonymously(auth).then(() => { initHost(); }).catch(e => alert('Gagal login: ' + e.message));

  function initHost() {
    generateQRs();

    // STATE / BUZZER
    let prevLocked = false;
    onValue(ref(db, `rooms/${roomId}/state`), snap => {
      const state = snap.val();
      const statusEl = document.getElementById('buzzerStatus');
      const winnerEl = document.getElementById('winnerDisplay');
      const isLocked = state && state.locked;

      if (!isLocked) {
        statusEl.textContent = 'STATUS: TERBUKA';
        statusEl.className = 'buzzer-status open';
        winnerEl.innerHTML = '';
      } else {
        statusEl.textContent = 'STATUS: TERKUNCI';
        statusEl.className = 'buzzer-status locked';
        if (state.name === 'Ditutup Host') {
          winnerEl.innerHTML = `🔒 Buzzer Ditutup Manual`;
        } else {
          winnerEl.innerHTML = `🏆 <span style="color:#22c55e">Tim ${state.team}</span> (${state.name})!`;
          if (!prevLocked) playHorn();
        }
      }
      prevLocked = isLocked;
    });

    // TIMER
    onValue(ref(db, `rooms/${roomId}/timer`), snap => {
      const timer = snap.val();
      clearInterval(timerInterval);
      const el = document.getElementById('hostTimer');
      if (!timer || !timer.running) { el.textContent = '—'; return; }
      const endAt = timer.startedAt + timer.duration * 1000;
      const tick = () => {
        const remaining = Math.max(0, endAt - serverNow());
        el.textContent = (remaining / 1000).toFixed(1);
        if (remaining <= 0) { el.textContent = 'WAKTU HABIS'; clearInterval(timerInterval); }
      };
      tick(); timerInterval = setInterval(tick, 100);
    });

    // PEMAIN
    onValue(ref(db, `rooms/${roomId}/players`), snap => {
      const players = snap.val() || {};
      const teams = {1: [], 2: [], 3: [], 4: []};
      Object.entries(players).forEach(([key, p]) => { if (teams[p.team]) teams[p.team].push({ key, name: p.name }); });
      
      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        const namesHTML = teams[i].length > 0 
          ? teams[i].map(p => `${p.name} <button class="btn-del-player" onclick="hapusPemain('${p.key}')">✕</button>`).join(', ')
          : '-';
        listEl.innerHTML += `
          <div class="player-row t${i}">
            <span style="color:#3b82f6; min-width:50px;">Tim ${i}</span>
            <span style="font-size:12px; color:var(--text-main); flex:1; text-align:left; padding:0 10px;">${namesHTML}</span>
            <span class="device-count">${teams[i].length} device</span>
          </div>
        `;
      }
    });

    // CHAT
    onValue(query(ref(db, `rooms/${roomId}/chat`), limitToLast(50)), snap => {
      const data = snap.val() || {};
      const msgs = Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      const el = document.getElementById('chatList');
      el.innerHTML = msgs.map(m => `
        <div class="chat-msg ${m.name === 'Host' ? 'host' : ''}">
          <div class="chat-who">${m.name === 'Host' ? 'HOST (Broadcast)' : `Tim ${m.team} • ${m.name}`}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      el.scrollTop = el.scrollHeight;
    });
  }

  // ============ FUNGSI ============
  window.bukaBuzzer = async () => { await remove(ref(db, `rooms/${roomId}/state`)); };
  window.tutupBuzzer = async () => { await set(ref(db, `rooms/${roomId}/state`), { locked: true, team: '-', name: 'Ditutup Host' }); };
  window.resetBuzzer = async () => { await remove(ref(db, `rooms/${roomId}/state`)); };
  
  window.hapusPemain = async (playerKey) => {
    if(confirm('Keluarkan pemain ini?')) await remove(ref(db, `rooms/${roomId}/players/${playerKey}`));
  };

  window.resetTotal = async () => {
    if(!confirm('Hapus SEMUA data di room ini?')) return;
    await remove(ref(db, `rooms/${roomId}`));
    location.reload();
  };

  window.exitHost = () => { if(confirm('Keluar?')) window.location.href = 'about:blank'; };

  window.startTimer = async () => {
    const dur = parseInt(document.getElementById('timerInput').value) || 30;
    await set(ref(db, `rooms/${roomId}/timer`), { running: true, startedAt: serverNow(), duration: dur });
  };
  window.stopTimer = async () => { await remove(ref(db, `rooms/${roomId}/timer`)); };

  window.kirimChatHost = async () => {
    const input = document.getElementById('hostChatInput');
    const text = input.value.trim();
    if (!text) return;
    await set(push(ref(db, `rooms/${roomId}/chat`)), { name: 'Host', team: 'ALL', text: text, ts: serverTimestamp() });
    input.value = '';
  };

  // ============ QR MODAL ============
  window.bukaModalQR = (teamNumber) => {
    const modal = document.getElementById('qrModal');
    const target = document.getElementById('qrModalTarget');
    document.getElementById('qrModalTitle').textContent = `Scan untuk Tim ${teamNumber}`;
    target.innerHTML = '';
    
    const baseUrl = getPlayerBaseUrl();
    new QRCode(target, { 
      text: `${baseUrl}?room=${roomId}&team=${teamNumber}`, 
      width: 300, height: 300, 
      colorDark: "#000000", colorLight: "#ffffff" 
    });
    
    modal.style.display = 'flex';
  };

  window.tutupModalQR = () => {
    document.getElementById('qrModal').style.display = 'none';
    document.getElementById('qrModalTarget').innerHTML = '';
  };

  function generateQRs() {
    const baseUrl = getPlayerBaseUrl();
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    for (let i = 1; i <= 4; i++) {
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `<h3>Tim ${i}</h3><div class="qr-wrapper" id="qr-mini-${i}"></div><button class="btn-zoom" onclick="bukaModalQR(${i})">🔍 Perbesar</button>`;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-mini-${i}`), { 
        text: `${baseUrl}?room=${roomId}&team=${i}`, 
        width: 80, height: 80, 
        colorDark: "#000000", colorLight: "#ffffff" 
      });
    }
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
</script>
</body>
</html>
