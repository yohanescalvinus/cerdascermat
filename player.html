<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pemain</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg-main: #f1f5f9;
    --bg-panel: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-color: #cbd5e1;
  }

  html, body {
    height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif; 
    background: var(--bg-main); color: var(--text-main);
  }
  
  .center-panel {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 24px; text-align: center; gap: 12px;
  }
  .center-panel input {
    padding: 12px 16px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-main); width: 100%; max-width: 280px;
  }
  .center-panel button {
    padding: 12px 24px; font-size: 16px; border-radius: 8px;
    border: none; background: #3b82f6; color: #fff; cursor: pointer; font-weight: 600;
  }

  #mainView { 
    display: none; flex-direction: column; 
    height: 100%; padding: 10px; gap: 10px; 
  }
  
  header { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 10px 14px; background: var(--bg-panel); border-radius: 8px; 
    flex-shrink: 0; border: 1px solid var(--border-color);
  }
  #identity { font-weight: 700; font-size: 14px; }
  .exit-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight:600; }

  .center-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    position: relative;
  }

  .timer-player { 
    text-align: center; font-size: 56px; font-weight: 800; 
    font-variant-numeric: tabular-nums; color: #64748b; 
    transition: color 0.3s, transform 0.1s;
  }
  .timer-player.urgent { color: #ef4444; transform: scale(1.15); font-weight: 900;}
  .timer-player.done { color: #ef4444; }
  .timer-player.paused { color: #f59e0b; opacity: 0.8; }

  .push-btn {
    width: 100%; max-width: 320px;
    height: 250px;
    font-size: 42px; font-weight: 800; border-radius: 24px; border: none; cursor: pointer;
    background: #3b82f6; color: #fff; 
    transition: transform 0.05s, background 0.2s, box-shadow 0.2s; 
    letter-spacing: 2px;
    box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
  }
  .push-btn:active { transform: scale(0.96); box-shadow: none; }
  .push-btn.pressed { background: #f59e0b; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }
  .push-btn.winner  { background: #22c55e; box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3); }
  .push-btn.loser   { background: #94a3b8; box-shadow: none; }

  .status { text-align: center; font-size: 15px; font-weight: 600; color: var(--text-muted); padding: 0 8px; }

  .chat-section { 
    display: flex; flex-direction: column; 
    background: var(--bg-panel); border-radius: 8px; 
    overflow: hidden; height: 180px; flex-shrink: 0;
    border: 1px solid var(--border-color);
  }
  .chat-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .chat-msg { background: var(--bg-main); padding: 8px 10px; border-radius: 6px; max-width: 90%; border: 1px solid var(--border-color);}
  .chat-msg.mine { background: #e0e7ff; border-color: #c7d2fe; align-self: flex-end; }
  .chat-who { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; font-weight:600;}
  .chat-text { word-wrap: break-word; color: var(--text-main);}
  
  .chat-input { display: flex; border-top: 1px solid var(--border-color); flex-shrink: 0; background: var(--bg-main);}
  .chat-input input { flex: 1; border: none; background: transparent; color: var(--text-main); padding: 10px 12px; font-size: 14px; outline: none; }
  .chat-input button { border: none; background: #3b82f6; color: #fff; padding: 0 16px; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>

<div id="nameView" class="center-panel" style="display:none">
  <h1>Masukkan Nama</h1>
  <input id="nameInput" maxlength="20" placeholder="Nama Anda">
  <button onclick="simpanNama()">Lanjut</button>
</div>

<div id="mainView">
  <header>
    <div id="identity"></div>
    <button onclick="exitGame()" class="exit-btn">✕ Keluar</button>
  </header>

  <div class="center-area">
    <div id="timerPlayer" class="timer-player">—</div>
    <button id="btn" class="push-btn">TEKAN</button>
    <div id="status" class="status"></div>
  </div>

  <div class="chat-section">
    <div id="chatList" class="chat-list"></div>
    <div class="chat-input">
      <input id="chatMessage" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')kirimChat()">
      <button onclick="kirimChat()">Kirim</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, remove, push, runTransaction, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB98iws-cuHwi5jOftorleJ1-lwxJby0l0",
    authDomain: "cerdascermat-a3206.firebaseapp.com",
    databaseURL: "https://cerdascermat-a3206-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cerdascermat-a3206",
    storageBucket: "cerdascermat-a3206.firebasestorage.app",
    messagingSenderId: "1098230358098",
    appId: "1:1098230358098:web:301f0f0d25b220de75ff8b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let serverOffset = 0;
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  const serverNow = () => Date.now() + serverOffset;

  const params = new URLSearchParams(location.search);
  const roomId = (params.get('room') || '').toUpperCase();
  const teamId = parseInt(params.get('team') || 0);

  const teamColors = {
    1: '#ef4444', 2: '#3b82f6', 3: '#22c55e', 4: '#a855f7',
    5: '#f97316', 6: '#14b8a6', 7: '#ec4899', 8: '#84cc16'
  };
  document.documentElement.style.setProperty('--team-color', teamColors[teamId] || '#3b82f6');

  if (!roomId || !teamId) {
    document.body.innerHTML = '<div class="center-panel"><h2>Link tidak valid</h2></div>';
    throw new Error('Invalid URL');
  }

  let user = null, myName = null, myPlayerKey = null, state = 'idle';
  let timerInterval = null, stateData = null;
  let isStarting = false, authHandled = false, listenersAttached = false;
  let lastTickSecond = -1;

  // ==========================================
  // SISTEM SUARA YANG LEBIH AGRESIF
  // ==========================================
  let actx;
  function initAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (actx.state === 'suspended') {
      actx.resume();
    }
  }

  function playSound(freq = 880, dur = 0.15, vol = 1.0, type = 'sine') {
    try {
      initAudio();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; 
      o.frequency.value = freq;
      o.connect(g); 
      g.connect(actx.destination);
      
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
      
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { console.log('Audio error:', e); }
  }

  document.addEventListener('click', initAudio, { once: true });
  document.addEventListener('touchstart', initAudio, { once: true });

  signInAnonymously(auth).catch(e => console.error(e));

  onAuthStateChanged(auth, u => {
    user = u;
    if (!u || authHandled) return;
    authHandled = true;

    const saved = localStorage.getItem(`cc_name_${roomId}_${teamId}`);
    if (saved) { 
      myName = saved; 
      myPlayerKey = `Tim${teamId}_${myName.replace(/\s+/g, '_')}`; 
      mulaiMain(); 
    } 
    else { 
      document.getElementById('nameView').style.display = 'flex'; 
      document.getElementById('nameInput').focus(); 
    }
  });

  window.simpanNama = async () => {
    if (!user) { alert('Tunggu koneksi...'); return; }
    if (isStarting) return;
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { alert('Nama wajib diisi'); return; }
    
    myName = name;
    myPlayerKey = `Tim${teamId}_${myName.replace(/\s+/g, '_')}`;
    
    localStorage.setItem(`cc_name_${roomId}_${teamId}`, myName);
    document.getElementById('nameView').style.display = 'none';
    
    playSound(800, 0.2, 1.0, 'square');
    try { await mulaiMain(); } catch (e) {}
  };

  async function mulaiMain() {
    if (isStarting || !myName) return;
    isStarting = true;
    try {
      document.getElementById('mainView').style.display = 'flex';
      const identityEl = document.getElementById('identity');
      identityEl.textContent = `Tim ${teamId} • ${myName}`;
      identityEl.style.color = teamColors[teamId];

      const playerRef = ref(db, `rooms/${roomId}/players/${myPlayerKey}`);
      await set(playerRef, { team: teamId, name: myName, joinedAt: serverTimestamp() });
      
      // ====================================================
      // FITUR KICK DARI HOST (Mendengarkan apakah datanya dihapus)
      // ====================================================
      onValue(playerRef, (snap) => {
        if (!snap.exists() && !isStarting) {
          // Jika data hilang di tengah permainan, berarti Host meng-kick
          alert('Anda telah dikeluarkan dari room oleh Host.');
          localStorage.removeItem(`cc_name_${roomId}_${teamId}`);
          sessionStorage.clear();
          window.location.reload();
        }
      });
      // ====================================================

      if (!listenersAttached) {
        listenersAttached = true;
        
        let prevLocked = null; 
        onValue(ref(db, `rooms/${roomId}/state`), snap => {
          stateData = snap.val();
          const isLocked = stateData && stateData.locked;
          
          if (prevLocked !== null && prevLocked !== isLocked) {
            if (!isLocked) {
              playSound(800, 0.3, 1.0, 'square'); 
              setTimeout(() => playSound(1000, 0.3, 1.0, 'square'), 150);
            } else if (stateData.name === 'Ditutup Host') {
              playSound(300, 0.3, 1.0, 'square'); 
            }
          }
          
          prevLocked = isLocked;
          updateStateFromServer();
        });

        onValue(ref(db, `rooms/${roomId}/timer`), snap => { 
           startCountdown(snap.val()); 
        });
        
        onValue(query(ref(db, `rooms/${roomId}/chat`), limitToLast(50)), snap => {
          const data = snap.val() || {};
          const msgs = Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
          renderChat(msgs);
        });
      }
      ui();
    } catch (e) {
      document.getElementById('mainView').style.display = 'none';
      document.getElementById('nameView').style.display = 'flex';
      alert('Gagal masuk: ' + e.message);
    } finally { isStarting = false; }
  }

  function updateStateFromServer() {
    if (!stateData || !stateData.locked) {
      if (state !== 'idle') { state = 'idle'; ui(); }
      return;
    }
    if (stateData.playerKey === myPlayerKey) {
      if (state !== 'winner') { state = 'winner'; ui(); playSound(1400, 0.4, 1.0, 'square'); }
    } else {
      if (state !== 'loser') { state = 'loser'; ui(); playSound(220, 0.3, 1.0, 'square'); }
    }
  }

  function ui() {
    const btn = document.getElementById('btn'), status = document.getElementById('status');
    btn.className = 'push-btn ' + state;
    btn.style.background = (state === 'idle' || state === 'pressed') ? teamColors[teamId] : '';
    
    btn.textContent = (state === 'idle' ? 'TEKAN' : state === 'pressed' ? '…' : state === 'winner' ? 'TERCEPAT!' : 'TERKUNCI');
    status.textContent = (state === 'idle' ? 'Siap!' : state === 'pressed' ? 'Menunggu…' : state === 'winner' ? '🏆 Kamu tercepat!' : `Terkunci — Tim ${stateData?.team} (${stateData?.name})`);
  }

  window.tekan = async () => {
    if (state !== 'idle' || !myPlayerKey) return;
    state = 'pressed'; ui(); playSound(900, 0.1, 1.0, 'square');
    
    try {
      await runTransaction(ref(db, `rooms/${roomId}/state`), current => {
        if (current) return;
        return { locked: true, team: teamId, name: myName, playerKey: myPlayerKey, ts: Date.now() };
      });
    } catch (e) {}
    
    setTimeout(() => { if (state === 'pressed') { if (stateData && stateData.locked) updateStateFromServer(); else { state = 'idle'; ui(); } } }, 3000);
  };

  document.getElementById('btn').addEventListener('click', () => window.tekan());

  // ==========================================
  // FUNGSI TIMER (FIX SUARA & PAUSE & FORMAT JAM)
  // ==========================================
  function startCountdown(timer) {
    clearInterval(timerInterval);
    const el = document.getElementById('timerPlayer');
    
    if (!timer || !timer.running) { 
      el.textContent = '—'; 
      el.classList.remove('urgent','done', 'paused'); 
      lastTickSecond = -1;
      return; 
    }
    
    const endAt = timer.startedAt + timer.duration * 1000;
    
    timerInterval = setInterval(() => {
      if (timer.isPaused) {
        el.classList.add('paused');
        return;
      } else {
        el.classList.remove('paused');
      }

      const remainingMs = Math.max(0, endAt - serverNow());
      const remainingSec = Math.ceil(remainingMs / 1000);
      
      const h = Math.floor(remainingMs / 3600000);
      const m = Math.floor((remainingMs % 3600000) / 60000);
      const s = Math.floor((remainingMs % 60000) / 1000);
      
      let timeString = (h > 0) 
        ? `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`
        : `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      el.textContent = timeString;

      if (remainingMs <= 10000) {
        el.classList.add('urgent');
      } else {
        el.classList.remove('urgent');
      }

      if (remainingMs <= 0) {
        clearInterval(timerInterval);
        el.textContent = 'WAKTU HABIS';
        el.classList.remove('urgent');
        el.classList.add('done');
        playSound(200, 0.8, 1.0, 'sawtooth');
        return;
      }

      // SUARA DETAK JAM
      if (remainingSec !== lastTickSecond) {
        lastTickSecond = remainingSec;
        
        if (remainingSec <= 10) {
          playSound(1200, 0.1, 1.0, 'sawtooth'); 
        } else {
          playSound(600, 0.05, 1.0, 'sine'); 
        }
      }
    }, 100);
  }

  window.kirimChat = async () => {
    if (!myName) return;
    const input = document.getElementById('chatMessage'); 
    const text = input.value.trim();
    if (!text) return;
    try { 
      await set(push(ref(db, `rooms/${roomId}/chat`)), { name: myName, team: teamId, text: text, ts: serverTimestamp() }); 
      input.value = ''; 
    } catch (e) {
      alert('Gagal kirim chat: ' + e.message);
    }
  };

  function renderChat(msgs) {
    const el = document.getElementById('chatList');
    el.innerHTML = msgs.map(m => `
      <div class="chat-msg ${m.name === myName && m.team === teamId ? 'mine' : ''}">
        <div class="chat-who">${m.name === 'Host' ? 'HOST' : 'Tim ' + m.team + ' • ' + m.name}</div>
        <div class="chat-text">${escapeHtml(m.text)}</div>
      </div>
    `).join('');
    el.scrollTop = el.scrollHeight;
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

  window.exitGame = async () => {
    if (!confirm('Keluar dari permainan?')) return;
    if (myPlayerKey) try { await remove(ref(db, `rooms/${roomId}/players/${myPlayerKey}`)); } catch(e){}
    localStorage.removeItem(`cc_name_${roomId}_${teamId}`);
    document.body.innerHTML = '<div class="center-panel"><h2>Anda telah keluar</h2></div>';
  };
</script>
</body>
</html>
