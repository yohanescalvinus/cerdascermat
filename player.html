<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemain</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  .center-panel {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 24px; text-align: center; gap: 12px;
  }
  .center-panel input {
    padding: 12px 16px; font-size: 16px; border-radius: 8px;
    border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
    width: 100%; max-width: 280px;
  }
  .center-panel button {
    padding: 12px 24px; font-size: 16px; border-radius: 8px;
    border: none; background: #3b82f6; color: #fff; cursor: pointer;
    font-weight: 600;
  }
  .center-panel button:active { transform: scale(0.97); }

  #mainView {
    display: none;
    flex-direction: column;
    height: 100%;
    padding: 12px;
    gap: 12px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: #1e293b; border-radius: 8px;
  }
  #identity { font-weight: 600; font-size: 14px; }
  .exit-btn {
    background: #ef4444; color: #fff; border: none;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px;
  }

  .timer-player {
    text-align: center; font-size: 48px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #94a3b8; padding: 8px 0;
    transition: color 0.2s;
  }
  .timer-player.urgent { color: #f59e0b; }
  .timer-player.done { color: #ef4444; }

  .push-btn {
    flex: 1;
    min-height: 140px;
    font-size: 36px;
    font-weight: 800;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    background: #3b82f6;
    color: #fff;
    transition: transform 0.05s, background 0.2s;
    letter-spacing: 2px;
  }
  .push-btn:active { transform: scale(0.98); }
  .push-btn.pressed { background: #f59e0b; }
  .push-btn.winner  { background: #22c55e; }
  .push-btn.loser   { background: #64748b; }

  .status {
    text-align: center; font-size: 15px; min-height: 22px;
    color: #cbd5e1; padding: 0 8px;
  }

  .chat-section {
    display: flex; flex-direction: column;
    background: #1e293b; border-radius: 8px;
    overflow: hidden;
    height: 200px;
    flex-shrink: 0;
  }
  .chat-list {
    flex: 1; overflow-y: auto; padding: 8px 12px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 13px;
  }
  .chat-msg {
    background: #0f172a; padding: 6px 10px; border-radius: 6px;
    max-width: 85%;
  }
  .chat-msg.mine {
    background: #1d4ed8; align-self: flex-end;
  }
  .chat-who { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
  .chat-text { word-wrap: break-word; }
  .chat-input {
    display: flex; border-top: 1px solid #334155;
  }
  .chat-input input {
    flex: 1; border: none; background: transparent;
    color: #e2e8f0; padding: 10px 12px; font-size: 14px;
    outline: none;
  }
  .chat-input button {
    border: none; background: #3b82f6; color: #fff;
    padding: 0 16px; cursor: pointer; font-weight: 600;
  }
</style>
</head>
<body>

<div id="nameView" class="center-panel" style="display:none">
  <h1>Masukkan Nama</h1>
  <input id="nameInput" maxlength="20" placeholder="Nama Anda">
  <button onclick="simpanNama()">Lanjut</button>
</div>

<div id="mainView">
  <header>
    <div id="identity"></div>
    <button onclick="exitGame()" class="exit-btn">✕ Keluar</button>
  </header>

  <div id="timerPlayer" class="timer-player">—</div>

  <button id="btn" class="push-btn">TEKAN</button>

  <div id="status" class="status"></div>

  <div class="chat-section">
    <div id="chatList" class="chat-list"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Ketik pesan…" onkeypress="if(event.key==='Enter')kirimChat()">
      <button onclick="kirimChat()">Kirim</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, remove, push, runTransaction, serverTimestamp, query, limitToLast, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ============ KONFIGURASI ============
  const firebaseConfig = {
    // ⚠️ ISI SAMA DENGAN index.html (host)
    apiKey: "ISI_API_KEY",
    authDomain: "ISI.firebaseapp.com",
    databaseURL: "https://ISI-default-rtdb.firebaseio.com",
    projectId: "ISI",
    storageBucket: "ISI.appspot.com",
    messagingSenderId: "ISI",
    appId: "ISI"
  };
  // =====================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // Server offset
  let serverOffset = 0;
  onValue(ref(db, '.info/serverTimeOffset'), snap => {
    serverOffset = snap.val() || 0;
  });
  const serverNow = () => Date.now() + serverOffset;

  // Params
  const params = new URLSearchParams(location.search);
  const roomId = (params.get('room') || '').toUpperCase();
  const teamId = parseInt(params.get('team') || 0);

  if (!roomId || !teamId) {
    document.body.innerHTML = '<div class="center-panel"><h2>Link tidak valid</h2><p>Scan ulang QR dari host.</p></div>';
    throw new Error('Invalid URL params');
  }

  // State
  let user = null;
  let myName = null;
  let myPlayerKey = null;
  let state = 'idle';
  let timerInterval = null;
  let stateData = null;
  let isStarting = false;   // guard agar mulaiMain tidak dobel
  let authHandled = false;  // guard onAuthStateChanged
  let listenersAttached = false;

  // ============ AUTH ============
  signInAnonymously(auth).catch(e => {
    console.error('Auth error:', e);
    document.body.innerHTML = '<div class="center-panel"><h2>Gagal terhubung</h2><p>' + e.message + '</p></div>';
  });

  onAuthStateChanged(auth, u => {
    console.log('[AUTH] state changed:', u ? u.uid : 'null');
    user = u;
    if (!u) return;
    if (myPlayerKey) return;   // sudah main
    if (authHandled) return;   // sudah pernah init
    authHandled = true;

    const saved = localStorage.getItem(`cc_name_${roomId}_${teamId}`);
    if (saved) {
      myName = saved;
      mulaiMain();
    } else {
      document.getElementById('nameView').style.display = 'flex';
      document.getElementById('nameInput').focus();
    }
  });

  window.simpanNama = async () => {
    if (!user) { alert('Belum terhubung. Tunggu sebentar…'); return; }
    if (isStarting || myPlayerKey) return;  // guard double click

    const name = document.getElementById('nameInput').value.trim();
    if (!name) { alert('Nama wajib diisi'); return; }
    if (name.length > 20) { alert('Maksimal 20 karakter'); return; }

    myName = name;
    localStorage.setItem(`cc_name_${roomId}_${teamId}`, myName);
    document.getElementById('nameView').style.display = 'none';

    try {
      await mulaiMain();
    } catch (e) {
      // sudah di-handle di dalam mulaiMain
    }
  };

  // ============ MAIN ============
  async function mulaiMain() {
    if (isStarting) { console.log('[MAIN] already starting, skip'); return; }
    if (myPlayerKey) { console.log('[MAIN] already registered, skip'); return; }
    if (!myName) { console.warn('[MAIN] no name, abort'); return; }

    isStarting = true;
    console.log('[MAIN] starting for', myName, 'team', teamId, 'room', roomId);

    try {
      document.getElementById('mainView').style.display = 'flex';
      document.getElementById('identity').textContent = `Tim ${teamId} • ${myName}`;

      // Register player
      const playerRef = push(ref(db, `rooms/${roomId}/players`));
      myPlayerKey = playerRef.key;
      console.log('[MAIN] registering player', myPlayerKey);

      await set(playerRef, {
        team: teamId,
        name: myName,
        joinedAt: serverTimestamp()
      });
      console.log('[MAIN] player registered OK');

      try {
        await onDisconnect(playerRef).remove();
      } catch (e) {
        console.warn('[MAIN] onDisconnect failed (non-fatal):', e.message);
      }

      // Attach listeners (sekali saja)
      if (!listenersAttached) {
        listenersAttached = true;

        onValue(ref(db, `rooms/${roomId}/state`), snap => {
          stateData = snap.val();
          updateStateFromServer();
        }, err => {
          console.error('[STATE] listen error:', err);
        });

        onValue(ref(db, `rooms/${roomId}/timer`), snap => {
          startCountdown(snap.val());
        }, err => {
          console.error('[TIMER] listen error:', err);
        });

        onValue(query(ref(db, `rooms/${roomId}/chat`), limitToLast(50)), snap => {
          const data = snap.val() || {};
          const msgs = Object.entries(data)
            .map(([k, v]) => ({ key: k, ...v }))
            .sort((a, b) => (a.ts || 0) - (b.ts || 0));
          renderChat(msgs);
        }, err => {
          console.error('[CHAT] listen error:', err);
        });
      }

      ui();
      console.log('[MAIN] ready');
    } catch (e) {
      console.error('[MAIN] FAILED:', e);
      myPlayerKey = null;
      // Kembali ke form nama
      document.getElementById('mainView').style.display = 'none';
      document.getElementById('nameView').style.display = 'flex';

      let msg = e.message || String(e);
      if (msg.includes('PERMISSION_DENIED') || msg.includes('permission')) {
        msg = 'Izin Firebase ditolak (PERMISSION_DENIED).\n\n' +
              'Pastikan Firebase Rules mengizinkan write ke:\n' +
              'rooms/' + roomId + '/players\n\n' +
              'Cek Firebase Console → Realtime Database → Rules.';
      }
      alert('Gagal bergabung:\n\n' + msg);
    } finally {
      isStarting = false;
    }
  }

  function updateStateFromServer() {
    if (!stateData || !stateData.locked) {
      if (state === 'winner' || state === 'loser' || state === 'pressed') {
        state = 'idle';
        ui();
      }
      return;
    }
    // Locked - who won?
    if (stateData.playerKey === myPlayerKey) {
      if (state !== 'winner') { state = 'winner'; ui(); beep(1400); }
    } else {
      if (state !== 'loser') { state = 'loser'; ui(); beep(220); }
    }
  }

  // ============ UI ============
  function ui() {
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.className = 'push-btn ' + state;
    btn.textContent = (
      state === 'idle'    ? 'TEKAN' :
      state === 'pressed' ? '…' :
      state === 'winner'  ? 'TERCEPAT!' : 'TERKUNCI'
    );

    status.textContent = (
      state === 'idle'    ? 'Siap!' :
      state === 'pressed' ? 'Menunggu konfirmasi…' :
      state === 'winner'  ? '🏆 Kamu tercepat!' :
                            `Terkunci — Tim ${stateData?.team} (${stateData?.name}) lebih cepat.`
    );
  }

  // ============ BUZZER ============
  window.tekan = async () => {
    if (state !== 'idle') return;
    if (!myPlayerKey) {
      // Coba init ulang kalau belum terdaftar
      if (!isStarting && myName && user) {
        await mulaiMain();
      }
      if (!myPlayerKey) {
        console.warn('[TEKAN] not connected yet');
        return;
      }
    }

    state = 'pressed';
    ui();
    beep(900, 0.08);

    const stateRef = ref(db, `rooms/${roomId}/state`);
    try {
      const result = await runTransaction(stateRef, current => {
        if (current) return;  // abort jika sudah ada yang menang
        return {
          locked: true,
          team: teamId,
          name: myName,
          playerKey: myPlayerKey,
          ts: Date.now()
        };
      });

      if (!result.committed) {
        console.log('[TEKAN] transaction aborted — sudah ada yang lebih cepat');
        // listener state akan update
      }
    } catch (e) {
      console.error('[TEKAN] transaction error:', e.message);
    }

    // Timeout fallback jika state listener tidak konfirmasi
    setTimeout(() => {
      if (state === 'pressed') {
        // Cek stateData manual
        if (stateData && stateData.locked) {
          updateStateFromServer();
        } else {
          state = 'idle';
          ui();
        }
      }
    }, 3000);
  };

  document.getElementById('btn').addEventListener('click', () => window.tekan());

  // ============ TIMER ============
  function startCountdown(timer) {
    clearInterval(timerInterval);
    const el = document.getElementById('timerPlayer');
    if (!timer || !timer.running) {
      el.textContent = '—';
      el.classList.remove('urgent', 'done');
      return;
    }
    const endAt = timer.startedAt + timer.duration * 1000;
    const tick = () => {
      const remaining = Math.max(0, endAt - serverNow());
      el.textContent = (remaining / 1000).toFixed(1);
      if (remaining < 5000) el.classList.add('urgent');
      if (remaining <= 0) {
        el.textContent = 'TIME UP!';
        el.classList.remove('urgent');
        el.classList.add('done');
        clearInterval(timerInterval);
      }
    };
    tick();
    timerInterval = setInterval(tick, 100);
  }

  // ============ CHAT ============
  window.kirimChat = async () => {
    if (!myName) { alert('Isi nama dulu'); return; }
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    try {
      const chatRef = push(ref(db, `rooms/${roomId}/chat`));
      await set(chatRef, {
        name: myName,
        team: teamId,
        text: text,
        ts: serverTimestamp()
      });
      input.value = '';
    } catch (e) {
      console.error('[CHAT] send error:', e);
      alert('Gagal kirim chat: ' + e.message);
    }
  };

  function renderChat(msgs) {
    const el = document.getElementById('chatList');
    el.innerHTML = msgs.map(m => `
      <div class="chat-msg ${m.name === myName && m.team === teamId ? 'mine' : ''}">
        <div class="chat-who">Tim ${m.team}${m.name ? ' • ' + m.name : ''}</div>
        <div class="chat-text">${escapeHtml(m.text)}</div>
      </div>
    `).join('');
    el.scrollTop = el.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  // ============ EXIT ============
  window.exitGame = async () => {
    if (!confirm('Keluar dari permainan?')) return;
    if (myPlayerKey) {
      try {
        await remove(ref(db, `rooms/${roomId}/players/${myPlayerKey}`));
      } catch (e) {
        console.warn('[EXIT] remove failed:', e.message);
      }
    }
    localStorage.removeItem(`cc_name_${roomId}_${teamId}`);
    document.body.innerHTML = '<div class="center-panel"><h2>Anda telah keluar</h2><p>Tutup tab ini atau scan QR lagi untuk bergabung.</p></div>';
  };

  // ============ BEEP ============
  let actx;
  function beep(freq = 880, dur = 0.12) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.15, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // Resume audio context saat user interaksi (mobile requirement)
  document.addEventListener('click', () => {
    if (actx && actx.state === 'suspended') actx.resume();
  }, { once: false });
</script>
</body>
</html>
